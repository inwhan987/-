<!doctype html>
<html lang="ko" style="height:100%">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>실시간 로그 | 주식투자프로그램</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Noto Sans KR', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* 로그 라인 */
  .log-line { font-size: 11px; line-height: 1.6; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); word-break: break-all; overflow-wrap: anywhere; }
  .log-DEBUG    { color: #64748b; }
  .log-INFO     { color: #94a3b8; }
  .log-INFO.buy  { color: #f87171; font-weight: 600; }
  .log-INFO.sell { color: #60a5fa; font-weight: 600; }
  .log-WARNING  { color: #fbbf24; }
  .log-ERROR    { color: #f87171; font-weight: 700; }
  .log-CRITICAL { color: #f43f5e; font-weight: 700; background: rgba(244,63,94,0.1); }

  /* 틱 서브줄 (VWAP/RSI/BB/ST 등 들여쓰기 상세) */
  .log-sub { font-size: 10.5px; line-height: 1.6; padding: 1px 4px 1px 12px; color: #94a3b8; border-bottom: none; border-left: 2px solid #334155; margin-left: 8px; }
  .log-sub:last-of-type { margin-bottom: 6px; border-left-color: #1e293b; }

  /* 레벨 뱃지 */
  .level-badge { display: inline-block; width: 52px; text-align: center; border-radius: 3px; font-size: 9px; font-weight: 700; padding: 0 2px; margin-right: 3px; flex-shrink: 0; }
  .badge-DEBUG    { background: #1e293b; color: #475569; }
  .badge-INFO     { background: #1e3a5f; color: #60a5fa; }
  .badge-WARNING  { background: #451a03; color: #fbbf24; }
  .badge-ERROR    { background: #450a0a; color: #f87171; }
  .badge-CRITICAL { background: #4c0519; color: #fb7185; }

  /* 타임스탬프: 모바일에서 날짜 숨김 */
  .ts-date { color: #334155; }
  .ts-time { color: #475569; }
  @media (max-width: 640px) { .ts-date { display: none; } }

  /* 로그 컨테이너 — flex:1 로 남은 높이 자동 차지 */
  #log-container { flex: 1; overflow-y: auto; padding: 8px 10px; min-height: 0; }

  /* 상태 */
  .status-dot { width: 8px; height: 8px; border-radius: 9999px; display: inline-block; flex-shrink: 0; }
  .status-dot.connected { background: #22c55e; animation: pulse 2s infinite; }
  .status-dot.disconnected { background: #ef4444; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
</style>
</head>
<body>

<!-- 헤더 (2줄: 위=탭 네비, 아래=컨트롤) -->
<div class="flex-shrink-0 bg-slate-900 border-b border-slate-700">

  <!-- 1줄: 탭 네비 -->
  <div class="px-3 pt-2 pb-1 overflow-x-auto">
    <nav class="text-sm flex items-center gap-1 bg-slate-800 rounded-full px-1 py-1 border border-slate-700 w-fit">
      <a href="/" class="px-3 py-1 rounded-full text-slate-300 hover:bg-slate-700 whitespace-nowrap">대시보드</a>
      <a href="/reasons" class="px-3 py-1 rounded-full text-slate-300 hover:bg-slate-700 whitespace-nowrap">거래 이유</a>
      <a href="/charts" class="px-3 py-1 rounded-full text-slate-300 hover:bg-slate-700 whitespace-nowrap">차트</a>
      <a href="/logs" class="px-3 py-1 rounded-full font-semibold bg-indigo-600 text-white whitespace-nowrap">실시간 로그</a>
      <a href="/params" class="px-3 py-1 rounded-full text-slate-300 hover:bg-slate-700 whitespace-nowrap">파라미터</a>
    </nav>
  </div>

  <!-- 2줄: 컨트롤 -->
  <div class="px-3 pb-2 flex flex-wrap items-center gap-2">
    <!-- 상태 -->
    <div class="flex items-center gap-1">
      <span id="status-dot" class="status-dot disconnected"></span>
      <span id="status-text" class="text-xs text-slate-400 whitespace-nowrap">연결 중...</span>
    </div>

    <!-- 봇/대장주/웹/스크리너 -->
    <div class="flex text-xs rounded overflow-hidden border border-slate-600">
      <button onclick="setSource('bot')"      id="src-bot"      class="px-3 py-1 bg-indigo-600 text-white">스톡봇</button>
      <button onclick="setSource('leader')"   id="src-leader"   class="px-3 py-1 bg-slate-700 text-slate-300">대장주봇</button>
      <button onclick="setSource('web')"      id="src-web"      class="px-3 py-1 bg-slate-700 text-slate-300">웹</button>
      <button onclick="setSource('screener')" id="src-screener" class="px-3 py-1 bg-slate-700 text-slate-300">스크리너</button>
    </div>

    <!-- 자동스크롤 -->
    <label class="flex items-center gap-1 text-xs text-slate-400 cursor-pointer whitespace-nowrap">
      <input type="checkbox" id="auto-scroll" checked class="accent-indigo-500"> 자동
    </label>

    <!-- 레벨 필터 -->
    <select id="level-filter" class="text-xs bg-slate-800 border border-slate-600 text-slate-300 rounded px-2 py-1">
      <option value="ALL">전체</option>
      <option value="DEBUG">DEBUG</option>
      <option value="INFO">INFO</option>
      <option value="WARNING">WARNING</option>
      <option value="ERROR">ERROR</option>
      <option value="CRITICAL">CRITICAL</option>
    </select>

    <!-- 표시 줄 수 -->
    <select id="max-lines" title="표시 줄 수" class="text-xs bg-slate-800 border border-slate-600 text-slate-300 rounded px-2 py-1">
      <option value="500">500줄</option>
      <option value="1000">1000줄</option>
      <option value="2000">2000줄</option>
    </select>

    <!-- 지우기 -->
    <button onclick="clearLogs()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 rounded px-3 py-1 whitespace-nowrap">지우기</button>
  </div>
</div>

<!-- 로그 영역 -->
<div id="log-container" class="mono">
  <div id="log-lines"></div>
</div>

<script>
  const container   = document.getElementById('log-container');
  const logLines    = document.getElementById('log-lines');
  const autoScroll  = document.getElementById('auto-scroll');
  const levelFilter = document.getElementById('level-filter');
  const statusDot   = document.getElementById('status-dot');
  const statusText  = document.getElementById('status-text');

  // 표시 줄 수 — 셀렉트로 변경 가능, localStorage 에 저장 (최대 2000줄)
  const maxLinesSel = document.getElementById('max-lines');
  function _loadMaxLines() {
    const raw = localStorage.getItem('logMaxLines');
    if (raw === 'inf') return 2000;  // 구버전 '제한없음' 저장값 → 2000으로
    const v = parseInt(raw) || 500;
    return Math.min(v, 2000);
  }
  let MAX_LINES = _loadMaxLines();
  maxLinesSel.value = String(MAX_LINES);
  const SEEN_CAP = 5000;  // dedup 기억 줄 수
  let lineCount = 0;
  const logBuffer = [];

  // 스크리너 소스: 서버가 cursor 기반으로 새 줄만 전송 → Set 불필요
  // 봇/웹 소스: 재연결 시 마지막 200줄 재전송 → Set 으로 중복 차단
  // ※ 타임스탬프가 있는 구조화된 줄만 dedup (틱 로그 들여쓰기 상세 줄은 제외)
  const _seenSet   = new Set();
  const _seenQueue = [];
  function _trackSeen(raw) {
    _seenSet.add(raw);
    _seenQueue.push(raw);
    if (_seenQueue.length > SEEN_CAP) _seenSet.delete(_seenQueue.shift());
  }
  // 타임스탬프(YYYY-MM-DD HH:MM:SS)로 시작하는 구조화된 로그 줄인지 판별
  // 틱 로그의 들여쓰기 상세 줄(ST, DC, RSI, BB 등)은 타임스탬프 없음 → dedup 제외
  function _isStructuredLine(raw) {
    return /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/.test(raw);
  }

  function getLevel(line) {
    const m = line.match(/\|\s*(DEBUG|WARNING|ERROR|CRITICAL|INFO)\s*\|/);
    return m ? m[1] : 'INFO';
  }

  // 종목코드(6자리) → 안정적인 고유 색상. 같은 종목은 항상 같은 색 → 여러
  // 종목이 섞여 떠도 색으로 구분된다. 어두운 배경에서 잘 보이는 HSL 채도/명도.
  function _codeHue(code) {
    let h = 0;
    for (let i = 0; i < code.length; i++) h = (h * 31 + code.charCodeAt(i)) >>> 0;
    return h % 360;
  }
  function _codeColor(code) { return `hsl(${_codeHue(code)}, 72%, 66%)`; }
  // 코드 바로 뒤 종목명(한글/영문 토큰)은 함께 칠하되, 아래 키워드는 제외.
  const _NOT_NAME = /^(관망|미진입|미형성|보류|신호|스킵|진입|청산|예산|현재가|매도|매수|바스켓|보유|가상)/;
  function colorizeCodes(html) {
    // 코드 + (선택) 종목명 을 종목별 색으로. HTML 이스케이프 뒤라 안전.
    return html.replace(/\b(\d{6})\b(\s+)([가-힣A-Za-z][가-힣A-Za-z0-9]*)?/g,
      (m, code, sp, name) => {
        const col = _codeColor(code);
        let out = `<span style="color:${col};font-weight:600">${code}</span>`;
        if (name && !_NOT_NAME.test(name))
          out += `${sp}<span style="color:${col};font-weight:600">${name}</span>`;
        else if (name) out += sp + name;
        else if (sp) out += sp;
        return out;
      });
  }
  // 라인의 대표 종목코드 (좌측 보더 색용). leader_trader 우선, 없으면 첫 6자리.
  function primaryCode(raw) {
    const m = raw.match(/leader_trader:\s*(\d{6})/) || raw.match(/\b(\d{6})\b/);
    return m ? m[1] : null;
  }

  function isBuyLine(line)  { return line.includes('매수') || line.includes('BUY'); }
  function isSellLine(line) { return line.includes('매도') || line.includes('SELL'); }

  function isSubLine(raw) {
    return /^    /.test(raw);  // 4칸 들여쓰기 = 틱 상세 서브줄
  }

  function formatLine(raw) {
    // 서브줄 (VWAP/RSI/BB/ST 등) — 뱃지 없이 들여쓰기 스타일
    if (isSubLine(raw)) {
      const filter = levelFilter.value;
      if (filter !== 'ALL' && filter !== 'INFO') return null;
      let escaped = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      // 키워드 색상 강조
      escaped = escaped
        .replace(/(매수|BUY)/g,  '<span style="color:#f87171;font-weight:600">$1</span>')
        .replace(/(매도|SELL)/g, '<span style="color:#60a5fa;font-weight:600">$1</span>')
        .replace(/(상승추세)/g,  '<span style="color:#34d399">$1</span>')
        .replace(/(하락추세)/g,  '<span style="color:#f87171">$1</span>')
        .replace(/(홀드|HOLD|─홀드)/g, '<span style="color:#64748b">$1</span>')
        .replace(/(\+[\d.]+%)/g, '<span style="color:#34d399">$1</span>')
        .replace(/([-][\d.]+%)/g,'<span style="color:#f87171">$1</span>')
        .replace(/(RSI\s[\d.]+)/g,'<span style="color:#a78bfa">$1</span>')
        .replace(/(VWAP)/g,      '<span style="color:#38bdf8">$1</span>')
        .replace(/(ST\s)/g,      '<span style="color:#fb923c">ST </span>');
      return `<div class="log-line log-sub">${escaped}</div>`;
    }

    const level  = getLevel(raw);
    const filter = levelFilter.value;
    if (filter !== 'ALL' && level !== filter) return null;

    const badge = `<span class="level-badge badge-${level}">${level}</span>`;
    let cls = `log-line log-${level}`;
    if (level === 'INFO' && isBuyLine(raw))  cls += ' buy';
    if (level === 'INFO' && isSellLine(raw)) cls += ' sell';

    // 타임스탬프: 날짜/시간 분리 (모바일에서 날짜 CSS로 숨김)
    let formatted = raw
      .replace(
        /(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2})(\.\d+)?/,
        '<span class="ts-date">$1 </span><span class="ts-time">$2</span>'
      )
      .replace(/\| \w+\s*\|/, '| |');

    // 종목코드별 색상 강조 + 대표 종목 좌측 보더(여러 종목 구분).
    formatted = colorizeCodes(formatted);
    const pc = primaryCode(raw);
    const style = pc
      ? ` style="border-left:3px solid ${_codeColor(pc)};padding-left:6px"`
      : '';

    return `<div class="${cls}"${style}>${badge}${formatted}</div>`;
  }

  function renderBuffer() {
    logLines.innerHTML = '';
    lineCount = 0;
    const frag = document.createDocumentFragment();
    for (const raw of logBuffer) {
      const html = formatLine(raw);
      if (!html) continue;
      const div = document.createElement('div');
      div.innerHTML = html;
      frag.appendChild(div.firstChild);
      lineCount++;
    }
    logLines.appendChild(frag);
    if (autoScroll.checked) container.scrollTop = container.scrollHeight;
  }

  function _ingest(raw) {
    if (!raw.trim()) return false;
    // 봇/웹 소스: 재연결 시 서버가 마지막 200줄 재전송 → 중복 차단
    // 단, 타임스탬프가 있는 구조화된 줄만 dedup 대상
    // 틱 로그 들여쓰기 상세 줄(ST, DC, RSI, BB 등)은 타임스탬프 없으므로 dedup 제외
    // 스크리너 소스: 서버가 cursor 기반으로 새 줄만 전송하므로 dedup 불필요
    if (currentSource !== 'screener' && _isStructuredLine(raw)) {
      if (_seenSet.has(raw)) return false;
      _trackSeen(raw);
    }
    logBuffer.push(raw);
    while (logBuffer.length > MAX_LINES) logBuffer.shift();
    return true;
  }

  // 초기 tail 묶음(서버가 한 이벤트로 전송) — 한 번에 렌더 + 스크롤 1회.
  // 줄별 addLine 이면 도착 순서대로 그려지며 '쭈르륵' 스크롤 잔상이 보인다.
  function addLines(raws) {
    let added = false;
    for (const raw of raws) if (_ingest(raw)) added = true;
    if (added) renderBuffer();
  }

  function addLine(raw) {
    if (!_ingest(raw)) return;
    const html = formatLine(raw);
    if (html) {
      logLines.insertAdjacentHTML('beforeend', html);
      lineCount++;
      while (lineCount > MAX_LINES) {
        logLines.firstChild?.remove();
        lineCount--;
      }
      if (autoScroll.checked) container.scrollTop = container.scrollHeight;
    }
  }

  function clearLogs() {
    logBuffer.length = 0;
    logLines.innerHTML = '';
    lineCount = 0;
    _seenSet.clear();
    _seenQueue.length = 0;
  }

  // 소스 전환
  let currentSource = 'bot';
  const SRC_LABEL = { bot: '스톡봇', leader: '대장주봇', web: '웹', screener: '스크리너' };
  function setSource(src) {
    if (currentSource === src) return;
    currentSource = src;
    ['bot', 'leader', 'web', 'screener'].forEach(s => {
      document.getElementById(`src-${s}`).className =
        s === src ? 'px-3 py-1 bg-indigo-600 text-white'
                  : 'px-3 py-1 bg-slate-700 text-slate-300';
    });
    clearLogs();
    if (es) es.close();
    connect();
  }

  // 표시 줄 수 변경: 저장 → 한도 적용 → 서버 tail 도 맞춰 재연결 (과거분 더 받아옴)
  maxLinesSel.addEventListener('change', () => {
    localStorage.setItem('logMaxLines', maxLinesSel.value);
    MAX_LINES = _loadMaxLines();
    clearLogs();           // 재연결 시 서버가 tail 만큼 다시 보내줌 (dedup 초기화)
    if (es) es.close();
    connect();
  });

  // EventSource 연결
  let es;
  function connect() {
    const tail = MAX_LINES;
    es = new EventSource(`/api/logs/stream?source=${currentSource}&tail=${tail}`);
    es.onopen = () => {
      statusDot.className = 'status-dot connected';
      statusText.textContent = `연결됨 (${SRC_LABEL[currentSource] || currentSource})`;
    };
    es.onmessage = (e) => {
      // 초기 tail 은 한 이벤트에 여러 줄(\n 결합)로 온다 → 배치 렌더
      if (e.data.indexOf('\n') !== -1) addLines(e.data.split('\n'));
      else addLine(e.data);
    };
    es.onerror = () => {
      statusDot.className = 'status-dot disconnected';
      statusText.textContent = '재연결 중...';
      es.close();
      setTimeout(connect, 3000);
    };
  }

  levelFilter.addEventListener('change', renderBuffer);
  connect();
</script>
</body>
</html>
