services:
  stock-bot:
    build: .
    container_name: stock-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
      METRICS_PORT: "9100"
    expose:
      - "9100"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    working_dir: /app
    networks: [botnet]

  prometheus:
    image: prom/prometheus:latest
    container_name: stock-prom
    restart: unless-stopped
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    networks: [botnet]

  grafana:
    image: grafana/grafana-oss:latest
    container_name: stock-grafana
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [botnet]

volumes:
  prom_data:
  grafana_data:

networks:
  botnet:
