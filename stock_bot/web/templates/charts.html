<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>차트 | 주식투자프로그램</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --up: #e03131; --down: #1971c2; }  /* 한국 관례: 상승=빨강, 하락=파랑 */
  body { font-family: 'Noto Sans KR', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .chip { cursor: pointer; transition: all .12s; }
  .chip.active { background:#4f46e5; color:#fff; border-color:#4f46e5; }
  /* 상단 가로 정보바 (네이버식 기본 표시: 시·고·저·종·등락·거래량 + 이동평균) */
  #topbar { position:absolute; top:6px; left:10px; right:72px; z-index:4;
            pointer-events:none; user-select:none; font-size:11px; line-height:1.6; }
  #topbar .tb-main { display:flex; flex-wrap:wrap; gap:9px; align-items:baseline; }
  #topbar .tb-ma   { display:flex; flex-wrap:wrap; gap:9px; margin-top:1px; }
  #topbar .tb-k    { color:#94a3b8; }
  #topbar b        { font-variant-numeric: tabular-nums; }
  /* 봉 호버 시 뜨는 상세 박스 */
  #tip { position:absolute; z-index:6; min-width:168px; display:none; pointer-events:none;
         background:rgba(255,255,255,.97); border:1px solid #e2e8f0; border-radius:10px;
         box-shadow:0 8px 24px rgba(15,23,42,.16); padding:9px 11px; font-size:12px; }
  #tip .tip-row { display:flex; justify-content:space-between; gap:14px; line-height:1.55; }
  #tip .tip-k { color:#94a3b8; }
  /* 거래량 패널 라벨 */
  #vol-label { position:absolute; top:6px; left:10px; z-index:4; font-size:11px;
               color:#64748b; pointer-events:none; user-select:none; }
  #vol-label b { color:#334155; }
</style>
</head>
<body class="bg-slate-50 text-slate-800">
<div class="max-w-6xl mx-auto p-4 sm:p-6 space-y-5">

  <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div class="flex items-center gap-4 flex-wrap">
      <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">
        <span class="text-indigo-600">●</span> 주식투자프로그램
      </h1>
      <nav class="text-sm flex items-center gap-1 bg-white rounded-full px-1 py-1 border border-slate-200">
        <a href="/" class="px-3 py-1 rounded-full text-slate-700 hover:bg-slate-100">대시보드</a>
        <a href="/reasons" class="px-3 py-1 rounded-full text-slate-700 hover:bg-slate-100">거래 이유</a>
        <a href="/charts" class="px-3 py-1 rounded-full font-semibold bg-indigo-600 text-white">차트</a>
        <a href="/logs" class="px-3 py-1 rounded-full text-slate-700 hover:bg-slate-100">실시간 로그</a>
        <a href="/params" class="px-3 py-1 rounded-full text-slate-700 hover:bg-slate-100">파라미터</a>
      </nav>
    </div>
  </header>

  <!-- 봇 그룹 탭 -->
  <div class="flex items-center gap-2">
    <button id="tab-stock" class="grp-tab px-4 py-1.5 rounded-full text-sm font-semibold border bg-indigo-600 text-white border-indigo-600">🤖 스톡봇</button>
    <button id="tab-leader" class="grp-tab px-4 py-1.5 rounded-full text-sm font-semibold border bg-white text-slate-700 border-slate-200 hover:bg-slate-100">👑 대장주</button>
    <span id="iv-badge" class="ml-1 text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-700 font-semibold"></span>
  </div>

  <!-- 종목 칩 목록 -->
  <div id="symbol-list" class="flex flex-wrap gap-2"></div>

  <!-- 차트 카드 -->
  <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <!-- 헤더: 종목명 + 현재가/등락 -->
    <div class="flex items-start justify-between gap-3 px-4 pt-4 pb-3 border-b border-slate-100">
      <div>
        <div class="flex items-baseline gap-2">
          <span id="chart-title" class="font-bold text-lg">종목을 선택하세요</span>
          <span id="chart-meta" class="text-xs text-slate-400"></span>
        </div>
        <div class="flex items-baseline gap-2 mt-1">
          <span id="last-price" class="mono text-2xl font-bold tabular-nums">—</span>
          <span id="last-change" class="mono text-sm font-semibold"></span>
        </div>
      </div>
      <button id="refresh-btn" class="shrink-0 text-xs px-3 py-1 rounded-full border border-slate-200 text-slate-600 hover:bg-slate-100">↻ 새로고침</button>
    </div>

    <!-- 가격 차트(캔들+이평) -->
    <div class="relative">
      <div id="topbar"></div>
      <div id="tip"></div>
      <div id="chart" style="width:100%;height:340px;"></div>
    </div>
    <!-- 거래량 차트(완전 분리, 시간축 동기화) -->
    <div class="relative border-t border-slate-200">
      <div id="vol-label"></div>
      <div id="volchart" style="width:100%;height:118px;"></div>
    </div>
    <div id="empty-msg" class="hidden text-center text-slate-400 text-sm py-24"></div>
  </section>

</div>

<script>
const COL_UP = '#e03131', COL_DOWN = '#1971c2';
// 네이버식 이동평균 (분봉 기준 기간) — 5/20/60
const MA_CFG = [
  { period: 5,  color: '#f59e0b', label: '5'  },
  { period: 20, color: '#16a34a', label: '20' },
  { period: 60, color: '#9333ea', label: '60' },
];
const PX_W = 64;   // 두 차트 가격축 폭 고정 → 플롯 영역 정렬
let CHART = null, VOLCHART = null, CANDLE = null, VOL = null, MA_SERIES = [];
let GROUPS = { stock: null, leader: null };
let curGroup = 'stock', curCode = null, curName = '';
let BARS = [];                 // 오름차순 [{time,o,h,l,c,v,ma5...}]
let BAR_BY_TIME = new Map();

const fmtP = n => (n == null ? '—' : Math.round(n).toLocaleString());
const fmtV = n => (n == null ? '—' : Number(n).toLocaleString());
const lastBar = () => (BARS.length ? BARS[BARS.length - 1] : null);

// 반응형 차트 높이: 데스크탑 크게, 모바일은 자동 축소
function chartHeights() {
  const w = window.innerWidth;
  if (w < 640)  return { main: 320, vol: 110 };   // 모바일
  if (w < 1024) return { main: 440, vol: 140 };   // 태블릿
  return { main: 520, vol: 160 };                 // 데스크탑
}

function ensureChart() {
  if (CHART) return;
  const el = document.getElementById('chart');
  const vel = document.getElementById('volchart');
  const H = chartHeights();
  el.style.height = H.main + 'px';
  vel.style.height = H.vol + 'px';

  CHART = LightweightCharts.createChart(el, {
    width: el.clientWidth, height: H.main,
    layout: { background: { color: '#fff' }, textColor: '#475569',
              fontFamily: 'JetBrains Mono, monospace', fontSize: 11 },
    localization: { priceFormatter: v => Math.round(v).toLocaleString() },  // 5,460 (소수점 제거·콤마)
    grid: { vertLines: { color: '#f1f5f9' }, horzLines: { color: '#f1f5f9' } },
    rightPriceScale: { borderColor: '#e2e8f0', minimumWidth: PX_W, scaleMargins: { top: 0.16, bottom: 0.06 } },
    timeScale: { visible: false, rightOffset: 3 },   // 시간축은 거래량 차트 하단에만
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: '#94a3b8', width: 1, style: 2, labelBackgroundColor: '#475569' },
      horzLine: { color: '#94a3b8', width: 1, style: 2, labelBackgroundColor: '#475569' },
    },
  });
  MA_SERIES = MA_CFG.map(m => CHART.addLineSeries({
    color: m.color, lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false,
    crosshairMarkerVisible: false,
  }));
  CANDLE = CHART.addCandlestickSeries({
    upColor: COL_UP, downColor: COL_DOWN, borderUpColor: COL_UP, borderDownColor: COL_DOWN,
    wickUpColor: COL_UP, wickDownColor: COL_DOWN,
    priceLineVisible: true, priceLineColor: '#334155', priceLineStyle: 2,   // 현재가 라인
    lastValueVisible: true,                                                 // 현재가 축 라벨
  });

  VOLCHART = LightweightCharts.createChart(vel, {
    width: vel.clientWidth, height: H.vol,
    layout: { background: { color: '#fff' }, textColor: '#94a3b8',
              fontFamily: 'JetBrains Mono, monospace', fontSize: 11 },
    grid: { vertLines: { color: '#f8fafc' }, horzLines: { color: '#f8fafc' } },
    rightPriceScale: { borderColor: '#e2e8f0', minimumWidth: PX_W, scaleMargins: { top: 0.16, bottom: 0 } },
    timeScale: { borderColor: '#e2e8f0', timeVisible: true, secondsVisible: false, rightOffset: 3 },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: '#94a3b8', width: 1, style: 2, labelVisible: false },
      horzLine: { visible: false, labelVisible: false },
    },
  });
  VOL = VOLCHART.addHistogramSeries({ priceFormat: { type: 'volume' }, lastValueVisible: false, priceLineVisible: false });

  // 두 차트 시간축 양방향 동기화 (줌·이동 공유)
  syncTimeScale(CHART, VOLCHART);
  // 가격 차트 호버: 정보바 갱신 + 상세박스 표시 + 거래량 차트 세로선 미러
  CHART.subscribeCrosshairMove(p => { updateInfo(p); showTip(p); mirror(VOLCHART, VOL, p); });
  // 거래량 차트 호버: 정보바 갱신 + 상세박스 숨김 + 가격 차트 세로선 미러
  VOLCHART.subscribeCrosshairMove(p => { updateInfo(p); hideTip(); mirror(CHART, CANDLE, p); });

  const onResize = () => {
    const h = chartHeights();
    el.style.height = h.main + 'px'; vel.style.height = h.vol + 'px';
    if (CHART) CHART.applyOptions({ width: el.clientWidth, height: h.main });
    if (VOLCHART) VOLCHART.applyOptions({ width: vel.clientWidth, height: h.vol });
  };
  window.addEventListener('resize', onResize);
}

let _syncing = false;
function syncTimeScale(a, b) {
  const ta = a.timeScale(), tb = b.timeScale();
  ta.subscribeVisibleLogicalRangeChange(r => { if (_syncing || !r) return; _syncing = true; tb.setVisibleLogicalRange(r); _syncing = false; });
  tb.subscribeVisibleLogicalRangeChange(r => { if (_syncing || !r) return; _syncing = true; ta.setVisibleLogicalRange(r); _syncing = false; });
}
function mirror(chart, series, param) {
  if (!param || param.time == null) { chart.clearCrosshairPosition(); return; }
  const bar = BAR_BY_TIME.get(param.time);
  if (bar) chart.setCrosshairPosition(bar.c, param.time, series);
}

// "YYYYMMDD" + "HHMMSS" → epoch초 (KST 벽시계를 UTC로 취급해 축에 그대로 표시)
function toEpoch(dateStr, t) {
  const y = +dateStr.slice(0,4), mo = +dateStr.slice(4,6)-1, d = +dateStr.slice(6,8);
  const hh = +t.slice(0,2), mm = +t.slice(2,4), ss = +(t.slice(4,6) || '0');
  return Math.floor(Date.UTC(y, mo, d, hh, mm, ss) / 1000);
}
function hhmm(epoch) {
  const dt = new Date(epoch * 1000), p = n => String(n).padStart(2, '0');
  return `${p(dt.getUTCHours())}:${p(dt.getUTCMinutes())}`;
}

function sma(closes, period) {
  const out = []; let sum = 0;
  for (let i = 0; i < closes.length; i++) {
    sum += closes[i];
    if (i >= period) sum -= closes[i - period];
    if (i >= period - 1) out.push({ i, value: sum / period });
  }
  return out;
}

function showEmpty(msg) {
  document.getElementById('chart').parentElement.classList.add('hidden');
  document.getElementById('volchart').parentElement.classList.add('hidden');
  const e = document.getElementById('empty-msg');
  e.classList.remove('hidden'); e.textContent = msg;
}
function showChart() {
  document.getElementById('chart').parentElement.classList.remove('hidden');
  document.getElementById('volchart').parentElement.classList.remove('hidden');
  document.getElementById('empty-msg').classList.add('hidden');
}

function setHeaderPrice(bar) {
  const lp = document.getElementById('last-price'), lc = document.getElementById('last-change');
  if (!bar) { lp.textContent = '—'; lp.style.color = ''; lc.textContent = ''; return; }
  const base = BARS.length ? BARS[0].o : bar.o;           // 당일 시가 기준 등락
  const diff = bar.c - base, pct = base ? diff / base * 100 : 0;
  const up = diff >= 0, col = up ? 'var(--up)' : 'var(--down)';
  lp.textContent = fmtP(bar.c); lp.style.color = col;
  lc.style.color = col;
  lc.textContent = `${up ? '▲' : '▼'} ${fmtP(Math.abs(diff))} (${up ? '+' : ''}${pct.toFixed(2)}%)`;
}

// 상단 가로 정보바: 시·고·저·종·등락·거래량 + 이동평균 (호버 봉 / 없으면 마지막 봉)
function renderTopBar(bar) {
  const tb = document.getElementById('topbar');
  if (!bar) { tb.innerHTML = ''; return; }
  const up = bar.c >= bar.o, col = up ? 'var(--up)' : 'var(--down)';
  const base = BARS.length ? BARS[0].o : bar.o;
  const diff = bar.c - base, pct = base ? diff / base * 100 : 0;
  const cup = diff >= 0, ccol = cup ? 'var(--up)' : 'var(--down)';
  const maHtml = MA_CFG.map(m => {
    const v = bar['ma' + m.period];
    return `<span style="color:${m.color}">${m.label} ${v != null ? fmtP(v) : '—'}</span>`;
  }).join('');
  tb.innerHTML =
    `<div class="tb-main">` +
      `<span class="tb-k">시</span><b class="mono" style="color:${col}">${fmtP(bar.o)}</b>` +
      `<span class="tb-k">고</span><b class="mono" style="color:var(--up)">${fmtP(bar.h)}</b>` +
      `<span class="tb-k">저</span><b class="mono" style="color:var(--down)">${fmtP(bar.l)}</b>` +
      `<span class="tb-k">종</span><b class="mono" style="color:${col}">${fmtP(bar.c)}</b>` +
      `<b class="mono" style="color:${ccol}">${cup ? '▲' : '▼'}${fmtP(Math.abs(diff))} ${cup ? '+' : ''}${pct.toFixed(2)}%</b>` +
      `<span class="tb-k">거</span><b class="mono">${fmtV(bar.v)}</b>` +
    `</div>` +
    `<div class="tb-ma"><span class="tb-k">이동평균</span>${maHtml}</div>`;
}

// 정보바 + 거래량 라벨 갱신
function updateInfo(param) {
  const bar = (param && param.time != null) ? BAR_BY_TIME.get(param.time) : null;
  const ref = bar || lastBar();
  renderTopBar(ref);
  document.getElementById('vol-label').innerHTML = ref ? `거래량 <b class="mono">${fmtV(ref.v)}</b>` : '';
}

// 봉 호버 상세박스 (마우스 위치 옆)
function hideTip() { document.getElementById('tip').style.display = 'none'; }
function showTip(param) {
  const tip = document.getElementById('tip');
  const bar = (param && param.time != null) ? BAR_BY_TIME.get(param.time) : null;
  if (!bar || !param.point) { tip.style.display = 'none'; return; }
  const base = BARS.length ? BARS[0].o : bar.o;
  const diff = bar.c - base, pct = base ? diff / base * 100 : 0;
  const up = diff >= 0, col = up ? COL_UP : COL_DOWN;
  const range = bar.h - bar.l, rpct = bar.l ? range / bar.l * 100 : 0;
  tip.innerHTML =
    `<div class="font-semibold mb-1 mono" style="color:${col}">${bar.dateStr || ''} ${hhmm(bar.time)}</div>` +
    `<div class="tip-row"><span class="tip-k">시가</span><b class="mono">${fmtP(bar.o)}</b></div>` +
    `<div class="tip-row"><span class="tip-k">고가</span><b class="mono" style="color:var(--up)">${fmtP(bar.h)}</b></div>` +
    `<div class="tip-row"><span class="tip-k">저가</span><b class="mono" style="color:var(--down)">${fmtP(bar.l)}</b></div>` +
    `<div class="tip-row"><span class="tip-k">종가</span><b class="mono" style="color:${col}">${fmtP(bar.c)}</b></div>` +
    `<div class="tip-row"><span class="tip-k">등락</span><b class="mono" style="color:${col}">${up ? '+' : ''}${fmtP(diff)} (${up ? '+' : ''}${pct.toFixed(2)}%)</b></div>` +
    `<div class="tip-row"><span class="tip-k">고저폭</span><b class="mono">${fmtP(range)} (${rpct.toFixed(2)}%)</b></div>` +
    `<div class="tip-row"><span class="tip-k">거래량</span><b class="mono">${fmtV(bar.v)}</b></div>`;
  tip.style.display = 'block';
  const host = document.getElementById('chart');
  const W = host.clientWidth, H = host.clientHeight, tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = param.point.x + 16, y = param.point.y + 12;
  if (x + tw > W - 6) x = param.point.x - tw - 16;
  if (y + th > H - 6) y = H - th - 6;
  if (x < 6) x = 6; if (y < 6) y = 6;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}

async function loadChart(code, name) {
  curCode = code; curName = name;
  document.getElementById('chart-title').textContent = `${name || code} (${code})`;
  document.getElementById('chart-meta').textContent = '불러오는 중…';
  hideTip();
  let data;
  try {
    const r = await fetch(`/api/chart/data/${code}`);
    data = await r.json();
  } catch (e) { showEmpty('불러오기 실패: ' + e); return; }

  const bars = (data.bars || []);
  if (!bars.length) {
    document.getElementById('chart-meta').textContent = '';
    setHeaderPrice(null);
    showEmpty(data.missing
      ? '아직 데이터가 없습니다 — 장중 봇이 이 종목을 조회하면 자동 생성됩니다.'
      : '봉 데이터가 비어 있습니다.');
    return;
  }
  const asc = bars.slice().sort((a, b) => a.t.localeCompare(b.t));   // newest-first → 오름차순
  const date = data.date || '';
  const dateStr = date ? `${date.slice(0,4)}.${date.slice(4,6)}.${date.slice(6,8)}` : '';
  BARS = asc.map(b => ({ time: toEpoch(date, b.t), o: b.o, h: b.h, l: b.l, c: b.c, v: b.v, dateStr }));

  ensureChart(); showChart();
  CANDLE.setData(BARS.map(b => ({ time: b.time, open: b.o, high: b.h, low: b.l, close: b.c })));
  VOL.setData(BARS.map(b => ({ time: b.time, value: b.v,
                               color: b.c >= b.o ? 'rgba(224,49,49,.45)' : 'rgba(25,113,194,.45)' })));

  // 이동평균선 계산·세팅 + 봉별 MA값 주입
  const closes = BARS.map(b => b.c);
  MA_CFG.forEach((m, mi) => {
    const pts = sma(closes, m.period);
    MA_SERIES[mi].setData(pts.map(p => ({ time: BARS[p.i].time, value: p.value })));
    pts.forEach(p => { BARS[p.i]['ma' + m.period] = p.value; });
  });

  // 우측 축 최고/최저 마커 (해당 봉 위치에 화살표 + 값·현재가대비%)
  let hiBar = BARS[0], loBar = BARS[0];
  BARS.forEach(b => { if (b.h > hiBar.h) hiBar = b; if (b.l < loBar.l) loBar = b; });
  const cur = BARS[BARS.length - 1].c;
  const hiPct = hiBar.h ? (cur - hiBar.h) / hiBar.h * 100 : 0;
  const loPct = loBar.l ? (cur - loBar.l) / loBar.l * 100 : 0;
  CANDLE.setMarkers([
    { time: hiBar.time, position: 'aboveBar', color: COL_UP, shape: 'arrowDown',
      text: `최고 ${fmtP(hiBar.h)} (${hiPct >= 0 ? '+' : ''}${hiPct.toFixed(2)}%)` },
    { time: loBar.time, position: 'belowBar', color: COL_DOWN, shape: 'arrowUp',
      text: `최저 ${fmtP(loBar.l)} (${loPct >= 0 ? '+' : ''}${loPct.toFixed(2)}%)` },
  ].sort((a, b) => a.time - b.time));   // setMarkers는 시간 오름차순 필요

  BAR_BY_TIME = new Map(BARS.map(b => [b.time, b]));
  CHART.timeScale().fitContent();

  const lb = lastBar();
  setHeaderPrice(lb); renderTopBar(lb);
  document.getElementById('vol-label').innerHTML = `거래량 <b class="mono">${fmtV(lb.v)}</b>`;

  const ageMin = Math.floor((data.age_sec || 0) / 60);
  const iv = data.interval_min ? `${data.interval_min}분봉` : '';
  document.getElementById('chart-meta').textContent =
    `${iv} · ${asc.length}봉 · ${date.slice(4,6)}/${date.slice(6,8)} · ${ageMin <= 1 ? '방금' : ageMin + '분 전'} 갱신`;
}

function renderSymbolList() {
  const g = GROUPS[curGroup];
  document.getElementById('iv-badge').textContent = g ? `${g.interval_min}분봉` : '';
  const wrap = document.getElementById('symbol-list');
  wrap.innerHTML = '';
  const syms = (g && g.symbols) || [];
  if (!syms.length) {
    wrap.innerHTML = '<span class="text-sm text-slate-400">종목이 없습니다.</span>';
    return;
  }
  syms.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip px-3 py-1.5 rounded-full text-sm border border-slate-200 bg-white hover:bg-slate-100';
    if (s.code === curCode) b.classList.add('active');
    b.innerHTML = `${s.name || s.code} <span class="mono text-xs opacity-60">${s.code}</span>` +
                  (s.tag ? ` <span class="text-[10px] opacity-70">· ${s.tag}</span>` : '');
    b.onclick = () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      b.classList.add('active');
      loadChart(s.code, s.name);
    };
    wrap.appendChild(b);
  });
  if (syms.length && (!curCode || !syms.some(s => s.code === curCode))) {
    const first = syms[0];
    wrap.firstChild.classList.add('active');
    loadChart(first.code, first.name);
  }
}

function setGroup(g) {
  curGroup = g; curCode = null;
  document.getElementById('tab-stock').className = 'grp-tab px-4 py-1.5 rounded-full text-sm font-semibold border ' +
    (g === 'stock' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100');
  document.getElementById('tab-leader').className = 'grp-tab px-4 py-1.5 rounded-full text-sm font-semibold border ' +
    (g === 'leader' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100');
  renderSymbolList();
}

async function init() {
  try {
    const r = await fetch('/api/chart/symbols');
    const j = await r.json();
    GROUPS.stock = j.stock; GROUPS.leader = j.leader;
  } catch (e) { showEmpty('종목 목록 로드 실패: ' + e); return; }
  document.getElementById('tab-stock').onclick = () => setGroup('stock');
  document.getElementById('tab-leader').onclick = () => setGroup('leader');
  document.getElementById('refresh-btn').onclick = () => { if (curCode) loadChart(curCode, curName); };
  setGroup('stock');
}
init();
</script>
</body>
</html>
