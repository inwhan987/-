name: pykrx-probe

# KRX 유니버스가 GitHub 미국 IP에서 되는지 — 무인증 vs 로그인 세션 비교.
# 무인증(앞선 결과)=빈응답. 이번엔 KRX_ID/KRX_PW 로그인 세션으로 재시도.
on:
  workflow_dispatch:

jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pykrx 1.2.8
        run: pip install "pykrx==1.2.8"
      - name: Probe KRX (로그인 세션) from GitHub IP
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python - <<'PY'
          import os, datetime as dt
          print("KRX_ID set:", bool(os.environ.get("KRX_ID")),
                "| KRX_PW set:", bool(os.environ.get("KRX_PW")))
          from pykrx import stock  # import 시점 로그인 시도
          def try_cap():
              last = "?"
              for back in range(1, 12):
                  d = (dt.date.today() - dt.timedelta(days=back)).strftime("%Y%m%d")
                  try:
                      df = stock.get_market_cap_by_ticker(d, market="KOSPI")
                      if len(df):
                          return f"cap OK rows={len(df)} date={d}"
                  except Exception as e:
                      last = f"{type(e).__name__}: {e}"
              return f"cap EMPTY/ERR last={last!r}"
          def try_names():
              try:
                  ts = stock.get_market_ticker_list(market="KOSPI")
                  return f"names OK n={len(ts)}"
              except Exception as e:
                  return f"names ERR {type(e).__name__}: {e}"
          print("RESULT_CAP  ", try_cap())
          print("RESULT_NAMES", try_names())
          PY
