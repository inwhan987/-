name: screener-run

# run-name 에 run_token 을 심어 파이가 원격 취소 시 이 실행을 식별한다
# (GitHub runs 목록의 name 으로 매칭 → /actions/runs/{id}/cancel).
run-name: "screener-run · ${{ inputs.run_token }}"

# 파이 OOM 오프로드 — 파이(_run_sc_job)가 섹터선정+섹터검수(①②-a)를 끝낸 뒤
# 이 워크플로우를 workflow_dispatch 로 트리거한다. CI는 무거운 스코어링(③)만 돌리고
# stdout 을 **중계 gist(gist_id)**에 누적 PATCH 한다. 파이가 그 gist 를 폴링해 실시간으로
# 받는다(터널 불필요). 종목검수(②-b)·SYMBOLS 기록은 파이가 스트림 로그를 로컬 실행과
# 동일하게 파싱해서 처리한다.
on:
  workflow_dispatch:
    inputs:
      sector:
        description: "선정 섹터(빈 값=전체)"
        required: false
        default: ""
      market:
        description: "kospi|kosdaq|all"
        required: false
        default: "all"
      market_top:
        description: "코스피/코스닥 각 시총 상위 N"
        required: false
        default: "800"
      top_n:
        description: "선별 종목 수"
        required: false
        default: "2"
      workers:
        description: "스코어링 워커 수"
        required: false
        default: "2"
      gist_id:
        description: "파이가 생성한 중계 gist ID"
        required: true
      run_token:
        description: "이번 실행 nonce (원격취소 run-name 매칭용)"
        required: true

jobs:
  score:
    runs-on: ubuntu-latest
    # 잡 상한 = 스크리너 스텝 상한(115분) + 여유. cold 캐시(DART finstate 전역락 직렬)
    # 1회 완주에 시간이 걸려 30분으론 부족했다(중간 ~500종목서 타임아웃 → 캐시 미시딩
    # → 다음도 cold 악순환). 스텝 타임아웃을 잡보다 낮춰, 초과 시 잡이 통째로 죽는 대신
    # 스텝만 실패하고 아래 'Save 캐시'(if: always())가 부분 DART 캐시를 시딩한다.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 업종 캐시(종목→업종명) + DART 재무 캐시를 실행들 사이 지속 — 러너 임시 디스크는
      # 폐기되므로 actions/cache 로 복원/저장한다. key 에 run_id 를 넣어 매 실행 새로 저장하고,
      # restore-keys 접두사 매칭으로 직전 실행의 최신 캐시를 복원(누적형 캐시 관용구).
      # 2일차부터 네이버 크롤 생략 + DART finstate(전역 락 직렬·호출당 ≥0.5초) 대량 생략
      # → CI 스코어링 시간 대폭 단축(cold DART 는 1600종목에서 타임아웃 주범).
      - name: Restore 업종·DART 캐시
        uses: actions/cache/restore@v4
        with:
          path: |
            data/naver_sector_cache.json
            data/dart_fin_cache.json
          key: screener-cache-${{ github.run_id }}
          restore-keys: |
            screener-cache-

      - name: Run screener (relay to gist)
        # 스텝 자체 상한 — 잡(120분)보다 낮춰 초과 시 잡을 죽이지 않고 스텝만 실패시켜
        # 아래 Save 스텝(if: always())이 반드시 돌게 한다(부분 DART 캐시 시딩).
        timeout-minutes: 115
        env:
          # KRX 로그인 세션(해외 IP 뚫림) + DART 재무 + gist 중계 인증
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          # gist 는 계정 단위라 기본 GITHUB_TOKEN 으론 못 쓴다 → gist 권한 PAT.
          SCREENER_GIST_TOKEN: ${{ secrets.SCREENER_GIST_TOKEN }}
          SCREENER_NAVER_RPM: '80'
          MALLOC_ARENA_MAX: '2'
          PYTHONUNBUFFERED: '1'
        run: |
          python ci_screener_stream.py \
            --gist-id "${{ inputs.gist_id }}" \
            --market "${{ inputs.market }}" \
            --market-top "${{ inputs.market_top }}" \
            --top "${{ inputs.top_n }}" \
            --workers "${{ inputs.workers }}" \
            --sector "${{ inputs.sector }}"

      # 부분 진행이라도 증분 DART 캐시(매 종목 디스크 기록)를 저장해 다음 실행을 warm 하게.
      # if: always() — 위 스텝이 타임아웃/실패해도 실행(잡이 죽지 않는 한). key 에 run_id 라
      # 매 실행 새 엔트리로 누적, 다음 실행 restore-keys 접두사 매칭으로 최신본 복원.
      - name: Save 업종·DART 캐시
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/naver_sector_cache.json
            data/dart_fin_cache.json
          key: screener-cache-${{ github.run_id }}
