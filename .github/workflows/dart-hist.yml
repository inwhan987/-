name: dart-hist

# DART 과거 재무제표 1회성 수집 (quality/growth 축 포인트인타임 백필).
# 분기 재무는 공시되면 불변이므로 (종목 × 재무기간) 단위로 한 번만 받는다 —
# 성공하면 이 워크플로는 다시 돌 일이 없다(새 분기는 파이의 토요일 주간배치가 채움).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: '종목 수 제한 (0=전체, 스모크는 5)'
        required: false
        default: '5'
      sleep:
        description: 'DART 호출 간격(초)'
        required: false
        default: '0.2'
      workers:
        description: '동시 워커 수'
        required: false
        default: '3'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 중단·타임아웃 후 재실행이 이미 받은 건을 다시 호출하지 않게 한다 —
      # DART 일일 한도(20,000)와 CI 분 둘 다 재소모하지 않는 게 목적.
      - name: Restore 진행상황
        uses: actions/cache/restore@v4
        with:
          path: |
            data/research/dart_hist.jsonl
            data/swing_dart_corp.json
          key: dart-hist-${{ github.run_id }}
          restore-keys: |
            dart-hist-

      - name: Collect
        timeout-minutes: 170
        env:
          TZ: Asia/Seoul
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python scripts/research/dart_hist.py \
            --limit ${{ inputs.limit }} \
            --sleep ${{ inputs.sleep }} \
            --workers ${{ inputs.workers }}

      # 스텝이 타임아웃/한도초과로 죽어도 부분 결과를 반드시 남긴다.
      - name: Save 진행상황
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/research/dart_hist.jsonl
            data/swing_dart_corp.json
          key: dart-hist-${{ github.run_id }}

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-hist
          path: data/research/dart_hist.jsonl
          if-no-files-found: warn
          retention-days: 30
