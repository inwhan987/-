services:
  stock-bot:
    build: .
    container_name: stock-bot
    user: "1000:1000"          # 호스트(inwhan)와 동일 uid → .git/data 소유권 통일(권한충돌 방지)
    restart: always
    stop_grace_period: 5s
    env_file:
      - .env
      - .env.overrides
    environment:
      TZ: Asia/Seoul
      METRICS_PORT: "9100"
      HOME: /tmp               # uid 1000 홈 부재 → git config --global 쓰기경로 확보
    expose:
      - "9100"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./db:/app/db
      - ./.kis_tokens:/app/.kis_tokens
      - ./.env:/app/.env
      - ./.env.overrides:/app/.env.overrides
      - ./stock_bot:/app/stock_bot
      - ./main.py:/app/main.py
      - ./.git:/app/.git
      - ./tools:/app/tools
      - ./leader_finder.py:/app/leader_finder.py
      - ./naver_quant.py:/app/naver_quant.py
      - ./score_leader_picks.py:/app/score_leader_picks.py
      - ./test_krx_login.py:/app/test_krx_login.py
    working_dir: /app/db
    command: ["python", "/app/main.py", "live"]
    networks: [botnet]

  leader-bot:
    build: .
    container_name: leader-bot
    user: "1000:1000"          # 호스트(inwhan)와 동일 uid → 권한충돌 방지
    restart: always
    stop_grace_period: 5s
    env_file:
      - .env
      - .env.overrides
    environment:
      TZ: Asia/Seoul
      HOME: /tmp
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./db:/app/db
      - ./.kis_tokens:/app/.kis_tokens
      - ./.env:/app/.env
      - ./.env.overrides:/app/.env.overrides
      - ./stock_bot:/app/stock_bot
      - ./main.py:/app/main.py
      - ./leader_finder.py:/app/leader_finder.py
      - ./naver_quant.py:/app/naver_quant.py
    working_dir: /app/db
    command: ["python", "/app/main.py", "leader"]
    networks: [botnet]

  stock-web:
    build: .
    container_name: stock-web
    user: "1000:1000"          # 호스트(inwhan)와 동일 uid → .git 소유권 통일(웹 파라미터 저장 커밋용)
    restart: always
    stop_grace_period: 5s
    env_file:
      - .env
      - .env.overrides
    environment:
      TZ: Asia/Seoul
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8001"
      HOME: /tmp
    ports:
      # 8001(호스트)은 caddy(Basic Auth)가 차지 — 인증 없는 직접 접속은 8002 (LAN 비상용).
      #   평소 접속은 안·밖 모두 http://dlsghks6919.duckdns.org:8001 (Basic Auth).
      #   caddy 장애 시 비상용: http://192.168.0.104:8002
      - "8002:8001"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./db:/app/db
      - ./.kis_tokens:/app/.kis_tokens
      - ./.env:/app/.env
      - ./.env.overrides:/app/.env.overrides
      - ./stock_bot:/app/stock_bot
      - ./main.py:/app/main.py
      - ./backtest_current.py:/app/backtest_current.py
      - ./backtest_compare.py:/app/backtest_compare.py
      - ./market_analysis.py:/app/market_analysis.py
      - ./screener.py:/app/screener.py
      - ./leader_finder.py:/app/leader_finder.py   # 웹 대장주 선별 버튼용
      - ./naver_quant.py:/app/naver_quant.py       # leader_finder/market_analysis 공용 모듈
      - ./screener_candidates.txt:/app/screener_candidates.txt
      - ./tools:/app/tools
      - ./.git:/app/.git    # 웹 UI 저장 시 git commit 위해 필요
    working_dir: /app/db
    command: ["python", "/app/main.py", "web"]
    # OOM 격리 (2026-07-05) — 파이 총 RAM ~905Mi. 스크리너 스파이크가 매매봇을
    #   죽이지 않게 웹만 캡. 초과 시 cgroup OOM이 웹 내부(스크리너 subprocess)만 kill.
    #   swappiness 100: 큰 배열을 zram으로 우선 밀어내 스크리너 완주 여지 확보.
    #   ※ 파이 커널 memory cgroup 활성 필요(/proc/cmdline에 cgroup_enable=memory).
    mem_limit: 650m          # 450→650 (2026-07-05): 스크리너 1000종목이 450m 초과로 cgroup에 잘림.
                             #   free -m 실측상 스크리너 피크 시 호스트 여유 ~250MB·available 257(호스트 안 굶음)
                             #   → 웹만 상향해 스크리너 완주 여지 확보. 웹 외(봇2+호스트)는 ~200MB.
    memswap_limit: 800m      # 총(RAM+swap) 상한. 웹이 650m 초과 시 최대 150m만 zram으로 스필,
                             #   그 이상은 스크리너만 cgroup kill → zram이 호스트 물리RAM을 잠식해 매매봇 죽이는 것 방지.
                             #   (swapaccount 미활성이면 커널이 무시 → 그땐 MARKET_TOP 축소로 대응)
    mem_reservation: 200m
    mem_swappiness: 100
    networks: [botnet]

  # 외부 접속용 리버스프록시 (2026-07-16) — 평문 http + Basic Auth.
  #   KT 회선이 외부→집 TLS 를 DPI 차단해 https 는 포기 (ops/Caddyfile 주석 참고).
  #   공유기 포트포워딩: 8001 → 파이 하나만 필요 (80/443 포워딩은 닫아도 됨).
  #   비밀번호 해시는 .caddy.env(untracked) — '$'는 '$$'로 이스케이프.
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    stop_grace_period: 5s
    env_file:
      - .caddy.env
    environment:
      TZ: Asia/Seoul
    ports:
      - "8001:8001"   # 메인 접속 포트 (http + Basic Auth, 사용자 고정 요청)
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data          # 인증서 보관 (gitignore)
      - ./data/caddy_config:/config
    mem_limit: 100m                 # 파이 RAM 보호 — caddy 평시 ~20-40MB
    networks: [botnet]

  # prometheus·grafana 모니터링 스택 제거 (2026-07-05) — 파이 RAM 확보.
  #   봇/웹 어느 것도 이 둘을 읽지 않음(단방향: 봇 :9100 노출 → prometheus 스크랩 → grafana 표시).
  #   metrics.py의 :9100 exporter·prometheus-client 의존성은 그대로 유지(무해).
  #   다시 켜려면 이 커밋을 revert. ops/prometheus.yml·ops/grafana/** 설정은 보존됨.

networks:
  botnet:
