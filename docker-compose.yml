services:
  stock-bot:
    build: .
    container_name: stock-bot
    restart: unless-stopped
    env_file:
      - .env
      - .env.overrides
    environment:
      TZ: Asia/Seoul
      METRICS_PORT: "9100"
    expose:
      - "9100"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./db:/app/db
      - ./.kis_tokens:/app/.kis_tokens
    working_dir: /app/db
    command: ["python", "/app/main.py", "live"]
    networks: [botnet]

  stock-web:
    build: .
    container_name: stock-web
    restart: unless-stopped
    env_file:
      - .env
      - .env.overrides
    environment:
      TZ: Asia/Seoul
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8001"
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./db:/app/db
      - ./.kis_tokens:/app/.kis_tokens
    working_dir: /app/db
    command: ["python", "/app/main.py", "web"]
    networks: [botnet]

  prometheus:
    image: prom/prometheus:latest
    container_name: stock-prom
    restart: unless-stopped
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    networks: [botnet]

  grafana:
    image: grafana/grafana-oss:latest
    container_name: stock-grafana
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [botnet]

volumes:
  prom_data:
  grafana_data:

networks:
  botnet:
