name: Build JetKVM Remote apps

# Builds downloadable Windows (.exe) and Android (.apk) apps in the cloud, so
# you don't need Android Studio or a Windows machine locally.
#
# How to get the files:
#  - Every run: open the run under the repo's "Actions" tab and download the
#    artifacts (Windows-installer / Android-apk) from the Summary page.
#  - Tag a release (e.g. `git tag v0.1.0 && git push origin v0.1.0`): the .exe
#    and .apk are attached to a GitHub Release with direct download links —
#    easiest for installing the APK straight from your phone.

on:
  push:
    branches: ['claude/jetkvm-tailscale-setup-trcl06']
    tags: ['v*']
    paths: ['jetkvm-remote/**', '.github/workflows/jetkvm-remote-build.yml']
  workflow_dispatch: {} # manual "Run workflow" button

# Several pushes close together (common when iterating fast) previously
# could run as overlapping workflow runs -- with no ordering guarantee
# between them, an OLDER run finishing its upload step AFTER a NEWER run
# already published would silently overwrite the "latest" release with a
# lower-versionCode APK, which is exactly what "업데이트 하면 실패한다"
# looks like from the app's side even though every individual commit's
# versionCode bump is correct. Queuing runs (not cancelling) guarantees
# they publish strictly in the order they were triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # needed to create/attach GitHub Releases on tags

defaults:
  run:
    working-directory: jetkvm-remote

jobs:
  # ---------------- Android APK ----------------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install deps
        run: npm ci
      - name: Bump version
        # Every build gets a unique, increasing version (0.1.<run number>) so
        # it's visible in the app's own footer whether a freshly downloaded
        # build is actually the new one.
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Build web assets
        run: npm run build
      - name: Sync Capacitor
        # android/ is committed (it carries hand-written native code:
        # JetKvmProxyServer.java, SettingsProxyPlugin.java) instead of being
        # scaffolded fresh each run -- sync just copies the new web build in
        # and updates the plugin list, leaving custom Java files alone.
        run: npx cap sync android
      - name: Bump Android versionCode
        # A separate signing fix (android/app/build.gradle's explicit debug
        # signingConfig) got past the signature check, but Android
        # separately refuses to install over an existing app unless the new
        # APK's versionCode (an integer) is STRICTLY GREATER than what's
        # already installed -- android/app/build.gradle had this hardcoded
        # to a fixed "1" on every single build, so every "update" install
        # attempt failed with "App not installed" regardless of the
        # signature being fine, needing a full uninstall/reinstall every
        # time. github.run_number only ever increases, so it's a correct
        # (and simple) source for this.
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "0.1.${{ github.run_number }}"/' android/app/build.gradle
      - name: Build debug APK
        run: chmod +x android/gradlew && cd android && ./gradlew clean assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk jetkvm-remote.apk
      - name: Write version metadata
        # Sideloaded APKs can't self-update the way the desktop build does
        # (no OS-level auto-install without a store) -- but the app can at
        # least check this file on startup and prompt the user to grab the
        # new one, instead of never knowing a new build exists at all.
        run: echo '{"version":"0.1.${{ github.run_number }}"}' > android-latest.json
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-apk
          path: jetkvm-remote/jetkvm-remote.apk
      - name: Publish APK to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 원격KVM (최신 빌드)
          prerelease: true
          files: |
            jetkvm-remote/jetkvm-remote.apk
            jetkvm-remote/android-latest.json

  # ---------------- Windows installer ----------------
  windows:
    needs: android # serialize the shared "latest" release update
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci
      - name: Bump version
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Build Windows installer
        run: npm run electron:build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-installer
          path: |
            jetkvm-remote/release/*.exe
            jetkvm-remote/release/latest.yml
      - name: Remove old release assets
        # electron-builder's artifactName is a fixed name (no version in it),
        # so a same-named upload below just replaces it going forward. This
        # clears out .exe files left over from before that fix, plus any
        # stale .blockmap (electron-builder writes a version-named one per
        # build, which would otherwise pile up like the old .exe files did).
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' | grep -E '\.exe$|\.blockmap$' | while read -r name; do
            gh release delete-asset latest "$name" --repo "${{ github.repository }}" -y || true
          done
      - name: Publish installer to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 원격KVM (최신 빌드)
          prerelease: true
          files: |
            jetkvm-remote/release/*.exe
            jetkvm-remote/release/*.blockmap
            jetkvm-remote/release/latest.yml
