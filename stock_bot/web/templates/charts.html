<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>차트 | 주식투자프로그램</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --up: #e03131; --down: #1971c2; }  /* 한국 관례: 상승=빨강, 하락=파랑 */
  body { font-family: 'Noto Sans KR', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .chip { cursor: pointer; transition: all .12s; }
  .chip.active { background:#4f46e5; color:#fff; border-color:#4f46e5; }
</style>
</head>
<body class="bg-slate-50 text-slate-800">
<div class="max-w-5xl mx-auto p-4 sm:p-6 space-y-5">

  <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div class="flex items-center gap-4 flex-wrap">
      <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">
        <span class="text-indigo-600">●</span> 주식투자프로그램
      </h1>
      <nav class="text-sm flex items-center gap-1 bg-white rounded-full px-1 py-1 border border-slate-200">
        <a href="/" class="px-3 py-1 rounded-full text-slate-700 hover:bg-slate-100">대시보드</a>
        <a href="/reasons" class="px-3 py-1 rounded-full text-slate-700 hover:bg-slate-100">거래 이유</a>
        <a href="/charts" class="px-3 py-1 rounded-full font-semibold bg-indigo-600 text-white">차트</a>
        <a href="/logs" class="px-3 py-1 rounded-full text-slate-700 hover:bg-slate-100">실시간 로그</a>
        <a href="/params" class="px-3 py-1 rounded-full text-slate-700 hover:bg-slate-100">파라미터</a>
      </nav>
    </div>
  </header>

  <!-- 봇 그룹 탭 -->
  <div class="flex items-center gap-2">
    <button id="tab-stock" class="grp-tab px-4 py-1.5 rounded-full text-sm font-semibold border bg-indigo-600 text-white border-indigo-600">🤖 스톡봇</button>
    <button id="tab-leader" class="grp-tab px-4 py-1.5 rounded-full text-sm font-semibold border bg-white text-slate-700 border-slate-200 hover:bg-slate-100">👑 대장주</button>
    <span id="iv-badge" class="ml-1 text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-700 font-semibold"></span>
  </div>

  <!-- 종목 칩 목록 -->
  <div id="symbol-list" class="flex flex-wrap gap-2"></div>

  <!-- 차트 카드 -->
  <section class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
    <div class="flex items-center justify-between mb-2">
      <div>
        <span id="chart-title" class="font-bold text-lg">종목을 선택하세요</span>
        <span id="chart-meta" class="text-xs text-slate-400 ml-2"></span>
      </div>
      <button id="refresh-btn" class="text-xs px-3 py-1 rounded-full border border-slate-200 text-slate-600 hover:bg-slate-100">↻ 새로고침</button>
    </div>
    <div id="chart" style="width:100%;height:420px;"></div>
    <div id="empty-msg" class="hidden text-center text-slate-400 text-sm py-20"></div>
  </section>

</div>

<script>
const COL_UP = '#e03131', COL_DOWN = '#1971c2';
let CHART = null, CANDLE = null, VOL = null;
let GROUPS = { stock: null, leader: null };
let curGroup = 'stock', curCode = null, curName = '';

function ensureChart() {
  if (CHART) return;
  const el = document.getElementById('chart');
  CHART = LightweightCharts.createChart(el, {
    width: el.clientWidth, height: 420,
    layout: { background: { color: '#fff' }, textColor: '#475569', fontFamily: 'JetBrains Mono, monospace' },
    grid: { vertLines: { color: '#f1f5f9' }, horzLines: { color: '#f1f5f9' } },
    rightPriceScale: { borderColor: '#e2e8f0' },
    timeScale: { borderColor: '#e2e8f0', timeVisible: true, secondsVisible: false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  });
  CANDLE = CHART.addCandlestickSeries({
    upColor: COL_UP, downColor: COL_DOWN, borderUpColor: COL_UP, borderDownColor: COL_DOWN,
    wickUpColor: COL_UP, wickDownColor: COL_DOWN,
  });
  VOL = CHART.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: '' });
  VOL.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  window.addEventListener('resize', () => { if (CHART) CHART.applyOptions({ width: el.clientWidth }); });
}

// "YYYYMMDD" + "HHMMSS" → epoch초 (KST 벽시계를 UTC로 취급해 축에 그대로 표시)
function toEpoch(dateStr, t) {
  const y = +dateStr.slice(0,4), mo = +dateStr.slice(4,6)-1, d = +dateStr.slice(6,8);
  const hh = +t.slice(0,2), mm = +t.slice(2,4), ss = +(t.slice(4,6) || '0');
  return Math.floor(Date.UTC(y, mo, d, hh, mm, ss) / 1000);
}

function showEmpty(msg) {
  document.getElementById('chart').style.display = 'none';
  const e = document.getElementById('empty-msg');
  e.classList.remove('hidden'); e.textContent = msg;
}
function showChart() {
  document.getElementById('chart').style.display = '';
  document.getElementById('empty-msg').classList.add('hidden');
}

async function loadChart(code, name) {
  curCode = code; curName = name;
  document.getElementById('chart-title').textContent = `${name || code} (${code})`;
  document.getElementById('chart-meta').textContent = '불러오는 중…';
  let data;
  try {
    const r = await fetch(`/api/chart/data/${code}`);
    data = await r.json();
  } catch (e) { showEmpty('불러오기 실패: ' + e); return; }

  const bars = (data.bars || []);
  if (!bars.length) {
    document.getElementById('chart-meta').textContent = '';
    showEmpty(data.missing
      ? '아직 데이터가 없습니다 — 장중 봇이 이 종목을 조회하면 자동 생성됩니다.'
      : '봉 데이터가 비어 있습니다.');
    return;
  }
  // newest-first 저장 → 오름차순 정렬
  const asc = bars.slice().sort((a, b) => a.t.localeCompare(b.t));
  const date = data.date || '';
  const candles = asc.map(b => ({ time: toEpoch(date, b.t), open: b.o, high: b.h, low: b.l, close: b.c }));
  const vols = asc.map(b => ({ time: toEpoch(date, b.t), value: b.v,
                               color: b.c >= b.o ? 'rgba(224,49,49,.35)' : 'rgba(25,113,194,.35)' }));
  ensureChart(); showChart();
  CANDLE.setData(candles); VOL.setData(vols);
  CHART.timeScale().fitContent();

  const ageMin = Math.floor((data.age_sec || 0) / 60);
  const iv = data.interval_min ? `${data.interval_min}분봉` : '';
  document.getElementById('chart-meta').textContent =
    `${iv} · ${asc.length}봉 · ${date.slice(4,6)}/${date.slice(6,8)} · ${ageMin <= 1 ? '방금' : ageMin + '분 전'} 갱신`;
}

function renderSymbolList() {
  const g = GROUPS[curGroup];
  document.getElementById('iv-badge').textContent = g ? `${g.interval_min}분봉` : '';
  const wrap = document.getElementById('symbol-list');
  wrap.innerHTML = '';
  const syms = (g && g.symbols) || [];
  if (!syms.length) {
    wrap.innerHTML = '<span class="text-sm text-slate-400">종목이 없습니다.</span>';
    return;
  }
  syms.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip px-3 py-1.5 rounded-full text-sm border border-slate-200 bg-white hover:bg-slate-100';
    if (s.code === curCode) b.classList.add('active');
    b.innerHTML = `${s.name || s.code} <span class="mono text-xs opacity-60">${s.code}</span>` +
                  (s.tag ? ` <span class="text-[10px] opacity-70">· ${s.tag}</span>` : '');
    b.onclick = () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      b.classList.add('active');
      loadChart(s.code, s.name);
    };
    wrap.appendChild(b);
  });
  // 그룹 전환 시 첫 종목 자동 로드
  if (syms.length && (!curCode || !syms.some(s => s.code === curCode))) {
    const first = syms[0];
    wrap.firstChild.classList.add('active');
    loadChart(first.code, first.name);
  }
}

function setGroup(g) {
  curGroup = g; curCode = null;
  document.getElementById('tab-stock').className = 'grp-tab px-4 py-1.5 rounded-full text-sm font-semibold border ' +
    (g === 'stock' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100');
  document.getElementById('tab-leader').className = 'grp-tab px-4 py-1.5 rounded-full text-sm font-semibold border ' +
    (g === 'leader' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100');
  renderSymbolList();
}

async function init() {
  try {
    const r = await fetch('/api/chart/symbols');
    const j = await r.json();
    GROUPS.stock = j.stock; GROUPS.leader = j.leader;
  } catch (e) { showEmpty('종목 목록 로드 실패: ' + e); return; }
  document.getElementById('tab-stock').onclick = () => setGroup('stock');
  document.getElementById('tab-leader').onclick = () => setGroup('leader');
  document.getElementById('refresh-btn').onclick = () => { if (curCode) loadChart(curCode, curName); };
  setGroup('stock');
}
init();
</script>
</body>
</html>
