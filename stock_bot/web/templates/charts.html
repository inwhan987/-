<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>차트 | 주식투자프로그램</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --up: #e03131; --down: #1971c2; }  /* 한국 관례: 상승=빨강, 하락=파랑 */
  body { font-family: 'Noto Sans KR', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .chip { cursor: pointer; transition: all .12s; }
  .chip.active { background:#4f46e5; color:#fff; border-color:#4f46e5; }
  /* 선택된 칩 hover: Tailwind hover:bg-slate-100 이 인디고 배경을 덮어
     흰 글자가 연회색 배경에 묻히던 문제 → 인디고 유지(더 진하게) */
  .chip.active:hover { background:#4338ca; color:#fff; border-color:#4338ca; }
  /* 상단 정보표 (독립 칸: 시·고·저·종·등락·거래량 + 이동평균) */
  #topbar { user-select:none; font-size:11px; line-height:1.6; }
  #topbar .tb-main { display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; }
  #topbar .tb-ma   { display:flex; flex-wrap:wrap; gap:10px; margin-top:2px;
                     padding-top:4px; border-top:1px dashed #eef2f6; }
  #topbar .tb-k    { color:#94a3b8; }
  #topbar b        { font-variant-numeric: tabular-nums; }
  /* 봉 호버 시 뜨는 상세 박스 */
  #tip { position:absolute; z-index:6; min-width:168px; display:none; pointer-events:none;
         background:rgba(255,255,255,.97); border:1px solid #e2e8f0; border-radius:10px;
         box-shadow:0 8px 24px rgba(15,23,42,.16); padding:9px 11px; font-size:12px; }
  #tip .tip-row { display:flex; justify-content:space-between; gap:14px; line-height:1.55; }
  #tip .tip-k { color:#94a3b8; }
  /* 거래량 패널 라벨 */
  #vol-label { position:absolute; top:6px; left:10px; z-index:4; font-size:11px;
               color:#64748b; pointer-events:none; user-select:none; }
  #vol-label b { color:#334155; }
  /* 스윙 진입 타점 (마커 클릭 상세) */
  #ev-strip { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  #ev-strip .ev-chip { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid #e2e8f0; background:#fff; cursor:pointer; }
  #ev-strip .ev-chip:hover { background:#f1f5f9; }
  #ev-strip .ev-chip.active { border-color:#6366f1; background:#eef2ff; }
  #ev-panel .ev-row { display:flex; justify-content:space-between; gap:12px; line-height:1.6; }
  #ev-panel .ev-k { color:#94a3b8; white-space:nowrap; }
  /* 데스크탑: 오버레이 글자도 차트에 맞춰 키움 */
  @media (min-width:1024px) {
    #topbar { font-size:13px; }
    #tip { font-size:13px; }
    #vol-label { font-size:13px; }
  }
</style>
</head>
<body class="bg-slate-50 text-slate-800">
<div class="max-w-6xl mx-auto p-3 sm:p-6 space-y-4 sm:space-y-6">

  <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div class="flex items-center gap-4 flex-wrap min-w-0">
      <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">
        <span class="text-indigo-600">●</span> 주식투자프로그램
      </h1>
      <nav class="text-sm flex items-center gap-1 bg-white rounded-full px-1 py-1 border border-slate-200 overflow-x-auto max-w-full whitespace-nowrap" style="scrollbar-width:none">
        <a href="/" class="px-3 py-1 rounded-full text-slate-700 hover:bg-slate-100">대시보드</a>
        <a href="/reasons" class="px-3 py-1 rounded-full text-slate-700 hover:bg-slate-100">거래 이유</a>
        <a href="/charts" class="px-3 py-1 rounded-full font-semibold bg-indigo-600 text-white">차트</a>
        <a href="/logs" class="px-3 py-1 rounded-full text-slate-700 hover:bg-slate-100">실시간 로그</a>
        <a href="/params" class="px-3 py-1 rounded-full text-slate-700 hover:bg-slate-100">파라미터</a>
      </nav>
    </div>
  </header>

  <!-- 봇 그룹 탭 -->
  <div class="flex items-center gap-2 overflow-x-auto max-w-full whitespace-nowrap -mx-4 px-4 sm:mx-0 sm:px-0" style="scrollbar-width:none">
    <button id="tab-stock" class="grp-tab shrink-0 px-3 sm:px-4 py-1.5 rounded-full text-sm font-semibold border bg-indigo-600 text-white border-indigo-600">⚡ 단타</button>
    <button id="tab-leader" class="grp-tab shrink-0 px-3 sm:px-4 py-1.5 rounded-full text-sm font-semibold border bg-white text-slate-700 border-slate-200 hover:bg-slate-100">👑 대장주</button>
    <button id="tab-swing" class="grp-tab shrink-0 px-3 sm:px-4 py-1.5 rounded-full text-sm font-semibold border bg-white text-slate-700 border-slate-200 hover:bg-slate-100">📈 스윙</button>
    <span id="iv-badge" class="shrink-0 ml-1 text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-700 font-semibold"></span>
    <!-- 📈 스윙 탭 전용: 일봉(기본) | 분봉 -->
    <div id="swing-kind" class="hidden shrink-0 ml-1 inline-flex rounded-full border border-emerald-200 overflow-hidden text-xs font-semibold">
      <button type="button" data-kind="daily" class="px-3 py-1 bg-emerald-600 text-white">일봉</button>
      <button type="button" data-kind="intraday" class="px-3 py-1 bg-white text-emerald-700 hover:bg-emerald-50">분봉</button>
    </div>
  </div>

  <!-- 종목 칩 목록 -->
  <div id="symbol-list" class="flex flex-wrap gap-2"></div>

  <!-- 차트 카드 -->
  <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <!-- 헤더: 종목명 + 현재가/등락 -->
    <div id="chart-header" class="flex items-start justify-between gap-3 px-3 sm:px-4 pt-3 sm:pt-4 pb-3 border-b border-slate-100">
      <div class="min-w-0">
        <div class="flex items-baseline gap-2 flex-wrap">
          <span id="chart-title" class="font-bold text-base sm:text-lg">종목을 선택하세요</span>
          <span id="chart-meta" class="text-[11px] sm:text-xs text-slate-400 basis-full sm:basis-auto"></span>
        </div>
        <div class="flex items-baseline gap-2 mt-1">
          <span id="last-price" class="mono text-xl sm:text-2xl font-bold tabular-nums">—</span>
          <span id="last-change" class="mono text-sm font-semibold"></span>
        </div>
      </div>
      <button id="refresh-btn" class="shrink-0 text-xs px-2.5 sm:px-3 py-1 rounded-full border border-slate-200 text-slate-600 hover:bg-slate-100" title="새로고침">↻<span class="hidden sm:inline"> 새로고침</span></button>
    </div>

    <!-- 상단 정보표(독립 칸): 시·고·저·종·등락·거래량 + 이동평균 -->
    <div id="topbar" class="px-3 sm:px-4 py-2 border-b border-slate-100 bg-slate-50/60"></div>

    <!-- 가격 차트(캔들+이평) -->
    <div class="relative">
      <div id="tip"></div>
      <div id="chart" style="width:100%;height:340px;"></div>
    </div>
    <!-- 거래량 차트(완전 분리, 시간축 동기화) -->
    <div class="relative border-t border-slate-200">
      <div id="vol-label"></div>
      <div id="volchart" style="width:100%;height:118px;"></div>
    </div>
    <!-- 📈 스윙 진입 타점: 마커(차트) 클릭 또는 칩 클릭 = 상세 -->
    <div id="ev-wrap" class="hidden border-t border-slate-100 px-4 py-2 space-y-2">
      <div id="ev-strip"></div>
      <div id="ev-panel" class="hidden rounded-lg border border-slate-200 bg-slate-50/70 px-3 py-2 text-xs"></div>
    </div>
    <div id="empty-msg" class="hidden text-center text-slate-400 text-sm py-24"></div>
  </section>

</div>

<script>
const COL_UP = '#e03131', COL_DOWN = '#1971c2';
// 이동평균 — 분봉(단타·대장주·스윙 분봉)은 5/20, 일봉(스윙)은 5/10/20/60/120/240
const MA_ALL = [
  { period: 5,   color: '#f59e0b', label: '5'   },
  { period: 10,  color: '#ec4899', label: '10'  },
  { period: 20,  color: '#16a34a', label: '20'  },
  { period: 60,  color: '#0ea5e9', label: '60'  },
  { period: 120, color: '#8b5cf6', label: '120' },
  { period: 240, color: '#64748b', label: '240' },
];
const MA_INTRADAY = new Set([5, 20]);
let MA_CFG = MA_ALL.filter(m => MA_INTRADAY.has(m.period));   // 현재 차트에 그리는 이평 (봉 종류에 따라 교체)
const DAILY_VIEW_BARS = 120;   // 일봉 기본 표시 구간 (데이터는 240일선 계산용으로 더 받음)
const PX_W = window.innerWidth < 640 ? 52 : 64;   // 두 차트 가격축 폭 고정 → 플롯 영역 정렬 (모바일은 좁게)
let CHART = null, VOLCHART = null, CANDLE = null, VOL = null, MA_SERIES = [];
let GROUPS = { stock: null, leader: null, swing: null };
const GROUP_KEYS = ['stock', 'leader', 'swing'];
let curGroup = 'stock', curCode = null, curName = '';
let swingKind = 'daily';   // 📈 스윙 탭: 'daily' | 'intraday'
let BARS = [];                 // 오름차순 [{time,o,h,l,c,v,ma5...}]
let PREV_CLOSE = null;         // 전일 종가 — 표준 등락율 기준(없으면 당일 시가로 폴백)
let BAR_BY_TIME = new Map();
let ENTRY_LINE = null;         // 현재 포지션 평단 수평선 (재로드 시 제거 후 재생성)
let DMA_LINES = [];            // 분봉 차트 위 일봉 이평(5~240) 수평 기준선 (재로드 시 제거)
let EVENTS = [];               // 📈 스윙 진입 타점 (서버 events → 봉 시각에 붙임)
let EV_BY_TIME = new Map();    // 봉 time → [event]
let LOAD_SEQ = 0;              // 차트 로드 순번 — 늦게 온 이전 종목 응답이 덮어쓰지 않게

const fmtP = n => (n == null ? '—' : Math.round(n).toLocaleString());
const fmtV = n => (n == null ? '—' : Number(n).toLocaleString());
// 경과시간 표준 표기: 방금 / N분 전 / N시간 M분 전 / N일 N시간 전
const fmtAge = sec => {
  sec = Math.max(0, Math.floor(sec));
  if (sec < 60) return '방금';
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  if (d > 0) return h > 0 ? `${d}일 ${h}시간 전` : `${d}일 전`;
  if (h > 0) return m > 0 ? `${h}시간 ${m}분 전` : `${h}시간 전`;
  return `${m}분 전`;
};
const lastBar = () => (BARS.length ? BARS[BARS.length - 1] : null);

// 반응형 차트 높이·폰트: 데스크탑 크게, 모바일은 자동 축소
function chartHeights() {
  const w = window.innerWidth;
  if (w < 640)  return { main: 320, vol: 110, font: 10 };   // 모바일
  if (w < 1024) return { main: 440, vol: 140, font: 12 };   // 태블릿
  return { main: 520, vol: 160, font: 13 };                 // 데스크탑
}

function ensureChart() {
  if (CHART) return;
  const el = document.getElementById('chart');
  const vel = document.getElementById('volchart');
  const H = chartHeights();
  el.style.height = H.main + 'px';
  vel.style.height = H.vol + 'px';

  CHART = LightweightCharts.createChart(el, {
    width: el.clientWidth, height: H.main,
    layout: { background: { color: '#fff' }, textColor: '#475569',
              fontFamily: 'JetBrains Mono, monospace', fontSize: H.font },
    localization: { priceFormatter: v => Math.round(v).toLocaleString() },  // 5,460 (소수점 제거·콤마)
    grid: { vertLines: { color: '#f1f5f9' }, horzLines: { color: '#f1f5f9' } },
    rightPriceScale: { borderColor: '#e2e8f0', minimumWidth: PX_W, scaleMargins: { top: 0.08, bottom: 0.06 } },
    timeScale: { visible: false, rightOffset: 3 },   // 시간축은 거래량 차트 하단에만
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: '#94a3b8', width: 1, style: 2, labelBackgroundColor: '#475569' },
      horzLine: { color: '#94a3b8', width: 1, style: 2, labelBackgroundColor: '#475569' },
    },
  });
  MA_SERIES = MA_ALL.map(m => CHART.addLineSeries({
    color: m.color, lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false,
    crosshairMarkerVisible: false,
  }));
  CANDLE = CHART.addCandlestickSeries({
    upColor: COL_UP, downColor: COL_DOWN, borderUpColor: COL_UP, borderDownColor: COL_DOWN,
    wickUpColor: COL_UP, wickDownColor: COL_DOWN,
    priceLineVisible: true, priceLineColor: '#334155', priceLineStyle: 2,   // 현재가 라인
    lastValueVisible: true,                                                 // 현재가 축 라벨
  });

  VOLCHART = LightweightCharts.createChart(vel, {
    width: vel.clientWidth, height: H.vol,
    layout: { background: { color: '#fff' }, textColor: '#94a3b8',
              fontFamily: 'JetBrains Mono, monospace', fontSize: H.font },
    grid: { vertLines: { color: '#f8fafc' }, horzLines: { color: '#f8fafc' } },
    rightPriceScale: { borderColor: '#e2e8f0', minimumWidth: PX_W, scaleMargins: { top: 0.16, bottom: 0 } },
    timeScale: { borderColor: '#e2e8f0', timeVisible: true, secondsVisible: false, rightOffset: 3 },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: '#94a3b8', width: 1, style: 2, labelVisible: false },
      horzLine: { visible: false, labelVisible: false },
    },
  });
  VOL = VOLCHART.addHistogramSeries({ priceFormat: { type: 'volume' }, lastValueVisible: false, priceLineVisible: false });

  // 두 차트 시간축 양방향 동기화 (줌·이동 공유)
  syncTimeScale(CHART, VOLCHART);
  // 가격 차트 호버: 정보바 갱신 + 상세박스 표시 + 거래량 차트 세로선 미러
  CHART.subscribeCrosshairMove(p => { updateInfo(p); showTip(p); mirror(VOLCHART, VOL, p); });
  // 거래량 차트 호버: 정보바 갱신 + 상세박스 숨김 + 가격 차트 세로선 미러
  VOLCHART.subscribeCrosshairMove(p => { updateInfo(p); hideTip(); mirror(CHART, CANDLE, p); });
  // 봉 클릭 → 그 봉의 진입 타점 상세 (마커가 있는 봉만)
  CHART.subscribeClick(p => { if (!p || p.time == null) return; const t = nearestEvTime(p.time); if (t != null) showEvents(t); });

  const onResize = () => {
    const h = chartHeights();
    el.style.height = h.main + 'px'; vel.style.height = h.vol + 'px';
    if (CHART) CHART.applyOptions({ width: el.clientWidth, height: h.main, layout: { fontSize: h.font } });
    if (VOLCHART) VOLCHART.applyOptions({ width: vel.clientWidth, height: h.vol, layout: { fontSize: h.font } });
    syncScaleWidth();
  };
  window.addEventListener('resize', onResize);
  // 모바일 주소창 접힘·카드 폭 변화 등 window resize 없이 컨테이너만 바뀌는 경우도 따라가게
  if (window.ResizeObserver) new ResizeObserver(() => onResize()).observe(el.parentElement);
}

// 두 차트의 우측 가격축 폭을 넓은 쪽에 맞춤 → 플롯 영역 오른쪽 끝·구분선 정렬
function syncScaleWidth() {
  if (!CHART || !VOLCHART) return;
  requestAnimationFrame(() => {
    try {
      const w = Math.max(PX_W, CHART.priceScale('right').width(), VOLCHART.priceScale('right').width());
      CHART.priceScale('right').applyOptions({ minimumWidth: w });
      VOLCHART.priceScale('right').applyOptions({ minimumWidth: w });
    } catch (e) {}
  });
}

let _syncing = false;
function syncTimeScale(a, b) {
  const ta = a.timeScale(), tb = b.timeScale();
  ta.subscribeVisibleLogicalRangeChange(r => { if (_syncing || !r) return; _syncing = true; tb.setVisibleLogicalRange(r); _syncing = false; });
  tb.subscribeVisibleLogicalRangeChange(r => { if (_syncing || !r) return; _syncing = true; ta.setVisibleLogicalRange(r); _syncing = false; });
}
function mirror(chart, series, param) {
  if (!param || param.time == null) { chart.clearCrosshairPosition(); return; }
  const bar = BAR_BY_TIME.get(param.time);
  if (bar) chart.setCrosshairPosition(bar.c, param.time, series);
}

// "YYYYMMDD" + "HHMMSS" → epoch초 (KST 벽시계를 UTC로 취급해 축에 그대로 표시)
function toEpoch(dateStr, t) {
  const y = +dateStr.slice(0,4), mo = +dateStr.slice(4,6)-1, d = +dateStr.slice(6,8);
  const hh = +t.slice(0,2), mm = +t.slice(2,4), ss = +(t.slice(4,6) || '0');
  return Math.floor(Date.UTC(y, mo, d, hh, mm, ss) / 1000);
}
function hhmm(epoch) {
  const dt = new Date(epoch * 1000), p = n => String(n).padStart(2, '0');
  return `${p(dt.getUTCHours())}:${p(dt.getUTCMinutes())}`;
}

function sma(closes, period) {
  const out = []; let sum = 0;
  for (let i = 0; i < closes.length; i++) {
    sum += closes[i];
    if (i >= period) sum -= closes[i - period];
    if (i >= period - 1) out.push({ i, value: sum / period });
  }
  return out;
}

function showEmpty(msg) {
  document.getElementById('chart-header').classList.add('hidden');
  document.getElementById('topbar').classList.add('hidden');
  document.getElementById('chart').parentElement.classList.add('hidden');
  document.getElementById('volchart').parentElement.classList.add('hidden');
  document.getElementById('ev-wrap').classList.add('hidden');
  const e = document.getElementById('empty-msg');
  e.classList.remove('hidden'); e.textContent = msg;
}
function showChart() {
  document.getElementById('chart-header').classList.remove('hidden');
  document.getElementById('topbar').classList.remove('hidden');
  document.getElementById('chart').parentElement.classList.remove('hidden');
  document.getElementById('volchart').parentElement.classList.remove('hidden');
  document.getElementById('empty-msg').classList.add('hidden');
}

function setHeaderPrice(bar) {
  const lp = document.getElementById('last-price'), lc = document.getElementById('last-change');
  if (!bar) { lp.textContent = '—'; lp.style.color = ''; lc.textContent = ''; return; }
  const base = PREV_CLOSE != null ? PREV_CLOSE : (BARS.length ? BARS[0].o : bar.o);  // 전일 종가 기준(표준), 없으면 당일 시가
  const diff = bar.c - base, pct = base ? diff / base * 100 : 0;
  const up = diff >= 0, col = up ? 'var(--up)' : 'var(--down)';
  lp.textContent = fmtP(bar.c); lp.style.color = col;
  lc.style.color = col;
  lc.textContent = `${up ? '▲' : '▼'} ${fmtP(Math.abs(diff))} (${up ? '+' : ''}${pct.toFixed(2)}%)`;
}

// 상단 가로 정보바: 시·고·저·종·등락·거래량 + 이동평균 (호버 봉 / 없으면 마지막 봉)
function renderTopBar(bar) {
  const tb = document.getElementById('topbar');
  if (!bar) { tb.innerHTML = ''; return; }
  const up = bar.c >= bar.o, col = up ? 'var(--up)' : 'var(--down)';
  const base = PREV_CLOSE != null ? PREV_CLOSE : (BARS.length ? BARS[0].o : bar.o);  // 전일 종가 기준(표준), 없으면 당일 시가
  const diff = bar.c - base, pct = base ? diff / base * 100 : 0;
  const cup = diff >= 0, ccol = cup ? 'var(--up)' : 'var(--down)';
  const maHtml = MA_CFG.map(m => {
    const v = bar['ma' + m.period];
    return `<span style="color:${m.color}">${m.label} ${v != null ? fmtP(v) : '—'}</span>`;
  }).join('');
  tb.innerHTML =
    `<div class="tb-main">` +
      `<span class="tb-k">시</span><b class="mono" style="color:${col}">${fmtP(bar.o)}</b>` +
      `<span class="tb-k">고</span><b class="mono" style="color:var(--up)">${fmtP(bar.h)}</b>` +
      `<span class="tb-k">저</span><b class="mono" style="color:var(--down)">${fmtP(bar.l)}</b>` +
      `<span class="tb-k">종</span><b class="mono" style="color:${col}">${fmtP(bar.c)}</b>` +
      `<b class="mono" style="color:${ccol}">${cup ? '▲' : '▼'}${fmtP(Math.abs(diff))} ${cup ? '+' : ''}${pct.toFixed(2)}%</b>` +
      `<span class="tb-k">거</span><b class="mono">${fmtV(bar.v)}</b>` +
    `</div>` +
    `<div class="tb-ma"><span class="tb-k">이동평균</span>${maHtml}</div>`;
}

// 정보바 + 거래량 라벨 갱신
function updateInfo(param) {
  const bar = (param && param.time != null) ? BAR_BY_TIME.get(param.time) : null;
  const ref = bar || lastBar();
  renderTopBar(ref);
  document.getElementById('vol-label').innerHTML = ref ? `거래량 <b class="mono">${fmtV(ref.v)}</b>` : '';

// 봉 호버 상세박스 (마우스 위치 옆)
function hideTip() { document.getElementById('tip').style.display = 'none'; }
function showTip(param) {
  const tip = document.getElementById('tip');
  const bar = (param && param.time != null) ? BAR_BY_TIME.get(param.time) : null;
  if (!bar || !param.point) { tip.style.display = 'none'; return; }
  const base = BARS.length ? BARS[0].o : bar.o;
  const up = bar.c >= base, col = up ? COL_UP : COL_DOWN;
  // 네이버식: 날짜·종가·거래량 + 이평선(분봉 5/20/60)
  const maHtml = MA_CFG.map(m => {
    const v = bar['ma' + m.period];
    return `<div class="tip-row"><span style="color:${m.color}">이평${m.period}</span>` +
           `<b class="mono" style="color:${m.color}">${v != null ? fmtP(v) : '—'}</b></div>`;
  }).join('');
  tip.innerHTML =
    `<div class="tip-row"><span class="tip-k">날짜</span><b class="mono">${bar.dateStr || ''} ${bar.daily ? '' : hhmm(bar.time)}</b></div>` +
    `<div class="tip-row"><span class="tip-k">종가</span><b class="mono" style="color:${col}">${fmtP(bar.c)}</b></div>` +
    `<div class="tip-row"><span class="tip-k">거래량</span><b class="mono">${fmtV(bar.v)}</b></div>` +
    maHtml;
  tip.style.display = 'block';
  const host = document.getElementById('chart');
  const W = host.clientWidth, H = host.clientHeight, tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = param.point.x + 16, y = param.point.y + 12;
  if (x + tw > W - 6) x = param.point.x - tw - 16;
  if (y + th > H - 6) y = H - th - 6;
  if (x < 6) x = 6; if (y < 6) y = 6;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}

async function loadChart(code, name) {
  const seq = ++LOAD_SEQ;       // 이 호출의 순번 — 이후 더 최신 클릭이 있으면 중단
  curCode = code; curName = name;
  document.getElementById('chart-title').textContent = `${name || code} (${code})`;
  document.getElementById('chart-meta').textContent = '불러오는 중…';
  hideTip();
  let data;
  try {
    // 스윙 탭은 겹치는 종목이라도 swing.db 봉(일봉/분봉 토글)으로 — 단타·대장주 스냅샷 안 씀
    const q = curGroup === 'swing' ? `?src=swing&kind=${swingKind}` : '';
    const r = await fetch(`/api/chart/data/${code}${q}`);
    data = await r.json();
  } catch (e) { if (seq === LOAD_SEQ) showEmpty('불러오기 실패: ' + e); return; }
  if (seq !== LOAD_SEQ) return;   // 그 사이 다른 종목을 클릭함 — 이 응답은 폐기

  const bars = (data.bars || []);
  if (!bars.length && data.note) { showEmpty(`${name || code}: ${data.note}`); return; }
  if (!bars.length) {
    document.getElementById('chart-meta').textContent = '';
    setHeaderPrice(null);
    showEmpty(data.missing
      ? '아직 데이터가 없습니다 — 장중 봇이 이 종목을 조회하면 자동 생성됩니다.'
      : '봉 데이터가 비어 있습니다.');
    return;
  }
  // 일봉(스윙 폴백)은 봉마다 d(날짜)를 실어 온다 — 날짜+시각으로 정렬
  const asc = bars.slice().sort((a, b) => ((a.d || '') + a.t).localeCompare((b.d || '') + b.t));   // newest-first → 오름차순
  const date = data.date || '';
  const fmtD = d => d ? `${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}` : '';
  const dateStr = fmtD(date);
  const daily = !!data.daily;
  BARS = asc.map(b => ({ time: toEpoch(b.d || date, b.t), o: b.o, h: b.h, l: b.l, c: b.c, v: b.v,
                         dateStr: b.d ? fmtD(b.d) : dateStr, daily }));
  PREV_CLOSE = (typeof data.prev_close === 'number') ? data.prev_close : null;

  ensureChart(); showChart();
  CANDLE.setData(BARS.map(b => ({ time: b.time, open: b.o, high: b.h, low: b.l, close: b.c })));
  VOL.setData(BARS.map(b => ({ time: b.time, value: b.v,
                               color: b.c >= b.o ? 'rgba(224,49,49,.45)' : 'rgba(25,113,194,.45)' })));

  // 이동평균선 계산·세팅 + 봉별 MA값 주입 — 일봉은 6개, 분봉은 5/20만 (나머지는 비움)
  MA_CFG = daily ? MA_ALL : MA_ALL.filter(m => MA_INTRADAY.has(m.period));
  const closes = BARS.map(b => b.c);
  MA_ALL.forEach((m, mi) => {
    if (!MA_CFG.includes(m)) { MA_SERIES[mi].setData([]); return; }
    const pts = sma(closes, m.period);
    MA_SERIES[mi].setData(pts.map(p => ({ time: BARS[p.i].time, value: p.value })));
    pts.forEach(p => { BARS[p.i]['ma' + m.period] = p.value; });
  });

  // 우측 축 최고/최저 마커 (해당 봉 위치에 화살표 + 값·현재가대비%)
  let hiBar = BARS[0], loBar = BARS[0];
  BARS.forEach(b => { if (b.h > hiBar.h) hiBar = b; if (b.l < loBar.l) loBar = b; });
  const cur = BARS[BARS.length - 1].c;
  const hiPct = hiBar.h ? (cur - hiBar.h) / hiBar.h * 100 : 0;
  const loPct = loBar.l ? (cur - loBar.l) / loBar.l * 100 : 0;
  const markers = [
    { time: hiBar.time, position: 'aboveBar', color: COL_UP, shape: 'arrowDown',
      text: `최고 ${fmtP(hiBar.h)} (${hiPct >= 0 ? '+' : ''}${hiPct.toFixed(2)}%)` },
    { time: loBar.time, position: 'belowBar', color: COL_DOWN, shape: 'arrowUp',
      text: `최저 ${fmtP(loBar.l)} (${loPct >= 0 ? '+' : ''}${loPct.toFixed(2)}%)` },
  ];
  // 📈 스윙 진입 타점 마커 — 체결(매수/청산)만. 시각을 그 봉의 시작에 붙인다.
  bindEvents(data.events || [], date, daily);
  EVENTS.forEach(e => markers.push(evMarker(e)));
  CANDLE.setMarkers(markers.sort((a, b) => a.time - b.time));   // setMarkers는 시간 오름차순 필요
  renderEvStrip();

  BAR_BY_TIME = new Map(BARS.map(b => [b.time, b]));
  // 종목 전환 시 가격축(우측 금액)이 이전 종목 스케일로 굳는 문제 방지 —
  // 사용자가 축을 드래그하면 autoScale 이 꺼지는데, 새 데이터에 맞춰 다시 켠다
  // (fitContent 는 시간축만 맞춤). 이후 재드래그로 다시 수동 스케일 가능.
  CHART.priceScale('right').applyOptions({ autoScale: true });
  VOLCHART.priceScale('right').applyOptions({ autoScale: true });
  if (daily && BARS.length > DAILY_VIEW_BARS) {
    // 일봉은 240일선용으로 길게 받으므로 기본은 최근 120봉만 보이게 (왼쪽으로 드래그하면 과거 확인)
    CHART.timeScale().setVisibleLogicalRange({ from: BARS.length - DAILY_VIEW_BARS, to: BARS.length + 2 });
  } else {
    CHART.timeScale().fitContent();
  }
  syncScaleWidth();   // 가격축 폭 맞춰 거래량 차트와 정렬

  // 헤더·정보바·메타는 이미 받은 로컬 봉(lastBar)만으로 즉시 그린다.
  // 아래 진입가선용 /api/positions(캐시 식으면 KIS 동기 호출이라 수 초 지연 가능)를
  // 기다리지 않게 해 가격 헤더가 늦게 뜨던 문제를 없앤다.
  const lb = lastBar();
  setHeaderPrice(lb); renderTopBar(lb);
  document.getElementById('vol-label').innerHTML = `거래량 <b class="mono">${fmtV(lb.v)}</b>`;

  const iv = data.daily ? '일봉' : (data.interval_min ? `${data.interval_min}분봉` : '');
  document.getElementById('chart-meta').textContent =
    `${iv} · ${asc.length}봉 · ${date.slice(4,6)}/${date.slice(6,8)} · ${fmtAge(data.age_sec || 0)} 갱신` +
    (data.source && String(data.source).startsWith('swing.db') ? ' · swing.db' : '');

  // 분봉 차트엔 일봉 이평(5/10/20/60/120/240)을 수평 기준선으로 덧그린다 — 네이버식 "일봉 이평 표시".
  // 당일 값은 마지막 일봉을 현재가로 갱신해 계산. 일봉 데이터 없는 종목이면 조용히 생략.
  DMA_LINES.forEach(l => { try { CANDLE.removePriceLine(l); } catch (e) {} }); DMA_LINES = [];
  if (!daily) drawDailyMaLines(code, date, seq);

  // 현재 포지션 평단(진입가) 수평선 — 부가 표시라 헤더 렌더 뒤 비동기로 덧그린다.
  // 대시보드가 채운 서버 공유 캐시(_POSITIONS_CACHE, 5초 TTL)를 재활용 → 보통 즉답.
  if (ENTRY_LINE) { try { CANDLE.removePriceLine(ENTRY_LINE); } catch (e) {} ENTRY_LINE = null; }
  try {
    const pr = await fetch('/api/positions');
    const ps = await pr.json();
    if (seq !== LOAD_SEQ) return;   // 늦게 온 응답 — 다른 종목 차트에 진입가선 덮어쓰기 방지
    const bare = code.split('.')[0];
    const pos = (Array.isArray(ps) ? ps : []).find(p => String(p.symbol).split('.')[0] === bare);
    if (pos && pos.avg > 0) {
      ENTRY_LINE = CANDLE.createPriceLine({
        price: pos.avg, color: '#7c3aed', lineWidth: 1, lineStyle: 2,  // 보라 점선
        axisLabelVisible: true, title: `진입가 ${fmtP(pos.avg)}`,
      });
    }
  } catch (e) { /* 표시 보조 — 실패해도 차트는 그림 */ }
}

// 분봉 차트에 일봉 이평선 값을 수평선으로 — swing.db 일봉(최근 800개)으로 계산
async function drawDailyMaLines(code, date, seq) {
  let d;
  try {
    const r = await fetch(`/api/chart/data/${code}?src=swing&kind=daily`);
    d = await r.json();
  } catch (e) { return; }
  if (seq !== LOAD_SEQ || !d || !d.daily || !Array.isArray(d.bars) || !d.bars.length || !BARS.length) return;
  const rows = d.bars.slice().sort((a, b) => (a.d || '').localeCompare(b.d || ''));
  const closes = rows.map(b => b.c);
  const cur = BARS[BARS.length - 1].c;
  // 오늘 일봉이 이미 있으면 현재가로 교체, 없으면(장중) 현재가를 오늘 종가로 추가
  if (rows[rows.length - 1].d === date) closes[closes.length - 1] = cur; else closes.push(cur);
  MA_ALL.forEach(m => {
    if (closes.length < m.period) return;
    const v = closes.slice(-m.period).reduce((a, b) => a + b, 0) / m.period;
    DMA_LINES.push(CANDLE.createPriceLine({
      price: v, color: m.color, lineWidth: 1, lineStyle: 3,          // 점선 — 봉 이평(실선)과 구분
      axisLabelVisible: false, title: `일${m.label} ${fmtP(v)}`,
    }));
  });
}

// ── 📈 스윙 진입 타점 ────────────────────────────────────────────────────
const EV_STYLE = {
  buy:     { label: '매수',  color: '#7c3aed', position: 'belowBar', shape: 'arrowUp' },
  sell:    { label: '매도',  color: '#0f766e', position: 'aboveBar', shape: 'arrowDown' },
};
// 이벤트 시각(HHMMSS) → 포함하는 봉(시작 시각 ≤ 이벤트 < 다음 봉). 일봉은 날짜 일치.
function bindEvents(events, date, daily) {
  EVENTS = []; EV_BY_TIME = new Map();
  if (!BARS.length) return;
  events.forEach(e => {
    const d = e.d || date;
    if (!d) return;
    const et = toEpoch(d, daily ? '000000' : (e.t || '000000'));
    let bar = null;
    for (const b of BARS) { if (b.time <= et) bar = b; else break; }
    if (!bar && !daily) bar = BARS[0];      // 첫 봉 이전(09:00 직후) 이벤트는 첫 봉에
    if (!bar) return;
    const ev = Object.assign({}, e, { time: bar.time });
    EVENTS.push(ev);
    if (!EV_BY_TIME.has(bar.time)) EV_BY_TIME.set(bar.time, []);
    EV_BY_TIME.get(bar.time).push(ev);
  });
}
// 클릭한 봉에 타점이 없으면 ±2봉 안의 가장 가까운 타점 (분봉은 봉이 몇 px 라 정확히 맞추기 어려움)
function nearestEvTime(time) {
  if (EV_BY_TIME.has(time)) return time;
  const i = BARS.findIndex(b => b.time === time);
  if (i < 0) return null;
  let best = null, bd = 3;
  for (const t of EV_BY_TIME.keys()) {
    const j = BARS.findIndex(b => b.time === t), d = Math.abs(j - i);
    if (j >= 0 && d < bd) { bd = d; best = t; }
  }
  return best;
}
// ── 한글 표기(쉬운 말) ──
const SWING_STRAT_KO = { BREAKOUT:'박스 돌파', PULLBACK:'눌림목 반등', NEWHIGH:'52주 신고가', MOMENTUM:'모멘텀',
  MEANREV:'단기 평균회귀', GAPGO:'갭 상승', FLOW_FORGN:'외국인 수급', FLOW_INST:'기관 수급', FLOW_BOTH:'쌍끌이 수급',
  FLOW_PULLBACK:'수급 눌림목', VALUE_MOM:'저평가+모멘텀', VALUE_PURE:'저평가' };
const SWING_STATE_KO = { WATCH:'감시 중', ARMED:'주문 넣음 (체결 기다리는 중)', ENTERED:'매수 체결됨', HOLDING:'보유 중',
  EXIT:'팔았음 (청산 완료)', DROPPED:'취소됨' };
const TRIGGER_KO = { '돌파':'박스 위로 뚫고 올라옴', '눌림반등':'눌렸다가 다시 반등' };
const TIER_KO = { priority:'우선★', normal:'일반' };
function stratKo(v) { return SWING_STRAT_KO[String(v || '').toUpperCase()] || v || ''; }
function stateKo(v) { return SWING_STATE_KO[String(v || '').toUpperCase()] || v || ''; }
function reasonKo(r) {
  r = String(r || '').trim();
  if (!r) return '';
  const m = r.match(/^(\d+)일선이탈$/);
  if (m) return `${m[1]}일 이동평균선 아래로 내려와서 팔았어요`;
  return { '손절':'손절선에 닿아서 팔았어요', '익절':'목표가에 닿아서 팔았어요',
    '트레일링':'고점에서 정해진 만큼 내려와서 팔았어요 (이익 지키기)', '타임스톱':'정해둔 보유 기간이 지나서 팔았어요',
    '셋업 붕괴':'진입 근거가 깨져서 취소했어요', '레짐 악화':'시장 분위기가 나빠져서 취소했어요',
    '미체결 반복':'주문이 계속 체결되지 않아 취소했어요', '슬롯 없음':'보유 종목 자리가 없어서 취소했어요' }[r] || r;
}
// note 예: "trigger=돌파 bar=... px=34495 x144 exit=stop5/tp10/trail3>2/t10/ma20 tier=priority score=72 | exit_odno=..."
function parseNote(note) {
  const out = { trigger: '', exit: '', tier: '', score: '', extra: [] };
  String(note || '').split('|').map(x => x.trim()).filter(Boolean).forEach((seg, i) => {
    if (i === 0 && /(^|\s)trigger=/.test(seg)) {
      const kv = {}; seg.split(/\s+/).forEach(t => { const j = t.indexOf('='); if (j > 0) kv[t.slice(0, j)] = t.slice(j + 1); });
      out.trigger = TRIGGER_KO[kv.trigger] || kv.trigger || '';
      out.tier = TIER_KO[kv.tier] || kv.tier || ''; out.score = kv.score || '';
      const m = (kv.exit || '').match(/^stop([\d.]+)\/tp([\d.]+)\/trail([\d.]+)>([\d.]+)\/t(\d+)\/ma(\d+)$/);
      if (m) out.exit = `손절 -${m[1]}% · 목표 ${+m[2] > 0 ? '+' + m[2] + '%' : '없음'} · 트레일링 ${+m[3] > 0 ? `+${m[3]}% 넘으면 고점 대비 -${m[4]}%에 매도` : '없음'} · 최대 ${m[5]}일 보유${+m[6] > 0 ? ` · ${m[6]}일선 깨지면 매도` : ''}`;
      else if (kv.exit) out.exit = kv.exit;
    } else if (/^exit_odno=/.test(seg)) { /* 주문번호는 숨김 */ }
    else if (/^reason:/.test(seg)) out.extra.push(reasonKo(seg.replace(/^reason:\s*/, '')));
    else out.extra.push(seg.replace(/^부분청산 (\d+)\/(\d+)@(\d+)\((.+)\)$/, (_, a, b, px, r) => `일부만 팔림 ${a}/${b}주 @${fmtP(+px)}원 (${r})`)
                          .replace(/^청산실패\((.+?)\):(.*)$/, (_, r, err) => `매도 주문 실패 (${r}) ${err}`));
  });
  return out;
}
function pctOf(a, b) { if (!a || !b) return ''; const v = (a / b - 1) * 100; return `${v >= 0 ? '+' : ''}${v.toFixed(1)}%`; }
function evLabel(e) {
  if (e.kind === 'sell') return `매도 ${e.pnl_pct != null ? (e.pnl_pct >= 0 ? '+' : '') + e.pnl_pct.toFixed(2) + '%' : ''}`.trim();
  return `매수 ${fmtP(e.px)}`;
}
function evMarker(e) {
  const s = EV_STYLE[e.kind] || EV_STYLE.buy;
  return { time: e.time, position: s.position, color: s.color, shape: s.shape, text: evLabel(e) };
}
function evTime(e) {
  const t = e.t || '';
  return `${e.d ? `${e.d.slice(4,6)}/${e.d.slice(6,8)} ` : ''}${t.length >= 4 ? `${t.slice(0,2)}:${t.slice(2,4)}${t.length >= 6 ? ':' + t.slice(4,6) : ''}` : ''}`.trim();
}
function evTimeKo(e) {
  const t = e.t || '';
  return `${e.d ? `${+e.d.slice(4,6)}월 ${+e.d.slice(6,8)}일 ` : ''}${t.length >= 4 ? `${t.slice(0,2)}:${t.slice(2,4)}` : ''}`.trim();
}
function renderEvStrip() {
  const wrap = document.getElementById('ev-wrap'), strip = document.getElementById('ev-strip');
  document.getElementById('ev-panel').classList.add('hidden');
  if (curGroup !== 'swing') { wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden');
  if (!EVENTS.length) {
    strip.innerHTML = '<span class="text-xs text-slate-400">아직 사고판 기록이 없어요 — 매수·매도가 되면 차트에 화살표로 표시돼요 (화살표나 아래 버튼을 누르면 자세히)</span>';
    return;
  }
  strip.innerHTML = `<span class="text-xs text-slate-500 mr-1">사고판 기록 ${EVENTS.length}건 <span class="text-slate-400">— 누르면 자세히</span></span>` +
    EVENTS.map((e, i) => { const s = EV_STYLE[e.kind] || EV_STYLE.buy;
      return `<button type="button" class="ev-chip mono" data-ev="${i}" style="color:${s.color}">${e.kind === 'sell' ? '▼' : '▲'} ${esc(evLabel(e))} <span class="text-slate-400">${esc(evTime(e))}</span></button>`; }).join('');
  strip.querySelectorAll('[data-ev]').forEach(b => b.addEventListener('click', () => {
    const e = EVENTS[+b.dataset.ev]; if (!e) return;
    showEvents(e.time, +b.dataset.ev);
    try { CHART.timeScale().scrollToPosition(0, false); } catch (x) {}
  }));
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
function showEvents(time, activeIdx) {
  const evs = EV_BY_TIME.get(time) || [];
  const panel = document.getElementById('ev-panel');
  if (!evs.length) { panel.classList.add('hidden'); return; }
  document.querySelectorAll('#ev-strip .ev-chip').forEach(c => c.classList.toggle('active',
    activeIdx != null ? +c.dataset.ev === activeIdx : EVENTS[+c.dataset.ev] && EVENTS[+c.dataset.ev].time === time));
  const bar = BAR_BY_TIME.get(time);
  const row = (k, v) => v == null || v === '' ? '' : `<div class="ev-row"><span class="ev-k">${k}</span><b class="text-right">${v}</b></div>`;
  const won = v => v != null && v !== '' ? `<span class="mono">${fmtP(v)}원</span>` : null;
  const pnlHtml = v => v == null ? '' : `<span class="mono" style="color:${v >= 0 ? COL_UP : COL_DOWN}">${v >= 0 ? '+' : ''}${v.toFixed(2)}%${v >= 0 ? ' 이익' : ' 손실'}</span>`;
  panel.innerHTML = `<div class="flex items-center justify-between mb-1">
      <span class="font-bold">${bar ? `${bar.dateStr} ${bar.daily ? '' : hhmm(bar.time)}` : ''} 봉 · 기록 ${evs.length}건</span>
      <button type="button" class="text-slate-400 hover:text-slate-600" onclick="document.getElementById('ev-panel').classList.add('hidden')">✕</button>
    </div>` + evs.map(e => {
      const s = EV_STYLE[e.kind] || EV_STYLE.buy;
      const n = parseNote(e.note);
      let summary, body;
      if (e.kind === 'buy') {
        const st = stateKo(e.state);
        summary = `${evTimeKo(e)}에 <b class="mono">${fmtP(e.px)}원</b>으로 ${e.shares != null ? `<b class="mono">${e.shares}주</b> ` : ''}샀어요`
                + (e.stop_px ? ` · 손절선 <span class="mono">${fmtP(e.stop_px)}원</span>(${pctOf(e.stop_px, e.px)})` : '')
                + (e.tp_px ? ` · 목표가 <span class="mono">${fmtP(e.tp_px)}원</span>(${pctOf(e.tp_px, e.px)})` : '')
                + (st ? ` · 지금 상태: <b>${esc(st)}</b>` : '');
        body = row('언제', esc(evTime(e))) + row('어떤 전략', esc(stratKo(e.strategy)))
             + row('왜 샀나', esc(n.trigger)) + row('산 가격', won(e.px)) + row('몇 주', e.shares != null ? `<span class="mono">${e.shares}주</span>` : null)
             + row('손절선', e.stop_px ? `${won(e.stop_px)} <span class="text-slate-400">(${pctOf(e.stop_px, e.px)})</span>` : null)
             + row('목표가', e.tp_px ? `${won(e.tp_px)} <span class="text-slate-400">(${pctOf(e.tp_px, e.px)})</span>` : '없음 (트레일링·기간으로 매도)')
             + row('매도 규칙', esc(n.exit)) + row('등급 · 점수', (n.tier || n.score) ? esc(`${n.tier}${n.tier && n.score ? ' · ' : ''}${n.score ? '종합 ' + n.score + '점' : ''}`) : null)
             + row('지금 상태', esc(st)) + row('참고', n.extra.length ? esc(n.extra.join(' / ')) : null);
      } else {
        summary = `${evTimeKo(e)}에 <b class="mono">${fmtP(e.px)}원</b>으로 ${e.shares != null ? `<b class="mono">${e.shares}주</b> ` : ''}팔았어요`
                + (e.entry_px ? ` · 산 가격 <span class="mono">${fmtP(e.entry_px)}원</span> → ${pnlHtml(e.pnl_pct)}` : (e.pnl_pct != null ? ` · ${pnlHtml(e.pnl_pct)}` : ''))
                + (e.reason ? `<br><span class="text-slate-600">왜 팔았나: ${esc(reasonKo(e.reason))}</span>` : '');
        body = row('언제', esc(evTime(e))) + row('어떤 전략', esc(stratKo(e.strategy)))
             + row('판 가격', won(e.px)) + row('산 가격', won(e.entry_px)) + row('손익', pnlHtml(e.pnl_pct))
             + row('왜 팔았나', esc(reasonKo(e.reason))) + row('몇 주', e.shares != null ? `<span class="mono">${e.shares}주</span>` : null)
             + row('매도 규칙', esc(n.exit)) + row('참고', n.extra.length ? esc(n.extra.join(' / ')) : null);
      }
      return `<div class="py-1.5 border-t border-slate-200 first:border-0">
        <div class="font-semibold mb-0.5" style="color:${s.color}">${e.kind === 'sell' ? '▼ 매도' : '▲ 매수'} <span class="text-slate-400 font-normal">${esc(stratKo(e.strategy))}</span></div>
        <div class="text-[13px] leading-relaxed text-slate-800 mb-1">${summary}</div>
        <details class="text-xs"><summary class="cursor-pointer text-slate-500 select-none">자세히 보기</summary><div class="mt-1">${body}</div></details>
      </div>`;
    }).join('');
  panel.classList.remove('hidden');
}

function renderSymbolList() {
  const g = GROUPS[curGroup];
  document.getElementById('iv-badge').textContent = g ? (g.label || `${g.interval_min}분봉`) : '';
  const wrap = document.getElementById('symbol-list');
  wrap.innerHTML = '';
  const syms = (g && g.symbols) || [];
  if (!syms.length) {
    wrap.innerHTML = '<span class="text-sm text-slate-400">종목이 없습니다.</span>';
    showEmpty(curGroup === 'leader' ? '대장주 선별 전입니다 (9:30 이후 자동 선별)'
            : curGroup === 'swing' ? '스윙 감시 종목이 없습니다 (야간 배치 대기)' : '종목이 없습니다.');
    return;
  }
  syms.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip px-3 py-1.5 rounded-full text-sm border border-slate-200 bg-white hover:bg-slate-100';
    if (s.code === curCode) b.classList.add('active');
    b.innerHTML = `${s.name || s.code} <span class="mono text-xs opacity-60">${s.code}</span>` +
                  (s.tag ? ` <span class="text-[10px] opacity-70">· ${s.tag}</span>` : '');
    b.onclick = () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      b.classList.add('active');
      loadChart(s.code, s.name);
    };
    wrap.appendChild(b);
  });
  if (syms.length && (!curCode || !syms.some(s => s.code === curCode))) {
    const first = syms[0];
    wrap.firstChild.classList.add('active');
    loadChart(first.code, first.name);
  }
}

function _renderSwingKind() {
  const box = document.getElementById('swing-kind');
  box.classList.toggle('hidden', curGroup !== 'swing');
  box.querySelectorAll('[data-kind]').forEach(btn => {
    const on = btn.dataset.kind === swingKind;
    btn.className = 'px-3 py-1 ' + (on ? 'bg-emerald-600 text-white' : 'bg-white text-emerald-700 hover:bg-emerald-50');
  });
}
function setGroup(g) {
  curGroup = g; curCode = null;
  _renderSwingKind();
  GROUP_KEYS.forEach(k => {
    document.getElementById(`tab-${k}`).className = 'grp-tab px-4 py-1.5 rounded-full text-sm font-semibold border ' +
      (g === k ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100');
  });
  renderSymbolList();
}

async function fetchSymbols() {
  try {
    const r = await fetch('/api/chart/symbols');
    const j = await r.json();
    const prev = JSON.stringify(GROUPS[curGroup]);
    GROUP_KEYS.forEach(k => { GROUPS[k] = j[k] || null; });
    // 현재 그룹의 심볼 목록이 바뀌었으면 사이드바만 재렌더(현재 차트 유지)
    if (JSON.stringify(GROUPS[curGroup]) !== prev) renderSymbolList();
  } catch (_) {}
}

async function init() {
  try {
    const r = await fetch('/api/chart/symbols');
    const j = await r.json();
    GROUP_KEYS.forEach(k => { GROUPS[k] = j[k] || null; });
  } catch (e) { showEmpty('종목 목록 로드 실패: ' + e); return; }
  GROUP_KEYS.forEach(k => { document.getElementById(`tab-${k}`).onclick = () => setGroup(k); });
  document.getElementById('refresh-btn').onclick = () => { if (curCode) loadChart(curCode, curName); };
  document.querySelectorAll('#swing-kind [data-kind]').forEach(btn => btn.onclick = () => {
    swingKind = btn.dataset.kind; _renderSwingKind();
    if (curCode) loadChart(curCode, curName);
  });
  setGroup('stock');
  // 섹터 전환·SYMBOLS 변경 시 사이드바 자동 갱신 (30초 폴)
  setInterval(fetchSymbols, 30000);
}
init();
</script>
</body>
</html>
