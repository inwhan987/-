<!doctype html>
<html lang="ko" style="height:100%">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>실시간 로그 | 주식투자프로그램</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Noto Sans KR', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* 로그 라인 */
  .log-line { font-size: 11px; line-height: 1.6; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); word-break: break-all; overflow-wrap: anywhere; }
  .log-DEBUG    { color: #64748b; }
  .log-INFO     { color: #94a3b8; }
  .log-INFO.buy  { color: #f87171; font-weight: 600; }
  .log-INFO.sell { color: #60a5fa; font-weight: 600; }
  .log-WARNING  { color: #fbbf24; }
  .log-ERROR    { color: #f87171; font-weight: 700; }
  .log-CRITICAL { color: #f43f5e; font-weight: 700; background: rgba(244,63,94,0.1); }

  /* 레벨 뱃지 */
  .level-badge { display: inline-block; width: 52px; text-align: center; border-radius: 3px; font-size: 9px; font-weight: 700; padding: 0 2px; margin-right: 3px; flex-shrink: 0; }
  .badge-DEBUG    { background: #1e293b; color: #475569; }
  .badge-INFO     { background: #1e3a5f; color: #60a5fa; }
  .badge-WARNING  { background: #451a03; color: #fbbf24; }
  .badge-ERROR    { background: #450a0a; color: #f87171; }
  .badge-CRITICAL { background: #4c0519; color: #fb7185; }

  /* 타임스탬프: 모바일에서 날짜 숨김 */
  .ts-date { color: #334155; }
  .ts-time { color: #475569; }
  @media (max-width: 640px) { .ts-date { display: none; } }

  /* 로그 컨테이너 — flex:1 로 남은 높이 자동 차지 */
  #log-container { flex: 1; overflow-y: auto; padding: 8px 10px; min-height: 0; }

  /* 상태 */
  .status-dot { width: 8px; height: 8px; border-radius: 9999px; display: inline-block; flex-shrink: 0; }
  .status-dot.connected { background: #22c55e; animation: pulse 2s infinite; }
  .status-dot.disconnected { background: #ef4444; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
</style>
</head>
<body>

<!-- 헤더 (2줄: 위=탭 네비, 아래=컨트롤) -->
<div class="flex-shrink-0 bg-slate-900 border-b border-slate-700">

  <!-- 1줄: 탭 네비 -->
  <div class="px-3 pt-2 pb-1 overflow-x-auto">
    <nav class="text-sm flex items-center gap-1 bg-slate-800 rounded-full px-1 py-1 border border-slate-700 w-fit">
      <a href="/" class="px-3 py-1 rounded-full text-slate-300 hover:bg-slate-700 whitespace-nowrap">대시보드</a>
      <a href="/reasons" class="px-3 py-1 rounded-full text-slate-300 hover:bg-slate-700 whitespace-nowrap">거래 이유</a>
      <a href="/logs" class="px-3 py-1 rounded-full font-semibold bg-indigo-600 text-white whitespace-nowrap">실시간 로그</a>
      <a href="/params" class="px-3 py-1 rounded-full text-slate-300 hover:bg-slate-700 whitespace-nowrap">파라미터</a>
    </nav>
  </div>

  <!-- 2줄: 컨트롤 -->
  <div class="px-3 pb-2 flex flex-wrap items-center gap-2">
    <!-- 상태 -->
    <div class="flex items-center gap-1">
      <span id="status-dot" class="status-dot disconnected"></span>
      <span id="status-text" class="text-xs text-slate-400 whitespace-nowrap">연결 중...</span>
    </div>

    <!-- 봇/웹/스크리너 -->
    <div class="flex text-xs rounded overflow-hidden border border-slate-600">
      <button onclick="setSource('bot')"      id="src-bot"      class="px-3 py-1 bg-indigo-600 text-white">봇</button>
      <button onclick="setSource('web')"      id="src-web"      class="px-3 py-1 bg-slate-700 text-slate-300">웹</button>
      <button onclick="setSource('screener')" id="src-screener" class="px-3 py-1 bg-slate-700 text-slate-300">스크리너</button>
    </div>

    <!-- 자동스크롤 -->
    <label class="flex items-center gap-1 text-xs text-slate-400 cursor-pointer whitespace-nowrap">
      <input type="checkbox" id="auto-scroll" checked class="accent-indigo-500"> 자동
    </label>

    <!-- 레벨 필터 -->
    <select id="level-filter" class="text-xs bg-slate-800 border border-slate-600 text-slate-300 rounded px-2 py-1">
      <option value="ALL">전체</option>
      <option value="DEBUG">DEBUG</option>
      <option value="INFO">INFO</option>
      <option value="WARNING">WARNING</option>
      <option value="ERROR">ERROR</option>
      <option value="CRITICAL">CRITICAL</option>
    </select>

    <!-- 지우기 -->
    <button onclick="clearLogs()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 rounded px-3 py-1 whitespace-nowrap">지우기</button>
  </div>
</div>

<!-- 로그 영역 -->
<div id="log-container" class="mono">
  <div id="log-lines"></div>
</div>

<script>
  const container   = document.getElementById('log-container');
  const logLines    = document.getElementById('log-lines');
  const autoScroll  = document.getElementById('auto-scroll');
  const levelFilter = document.getElementById('level-filter');
  const statusDot   = document.getElementById('status-dot');
  const statusText  = document.getElementById('status-text');

  const MAX_LINES = 500;
  let lineCount = 0;
  const logBuffer = [];

  function getLevel(line) {
    const m = line.match(/\|\s*(DEBUG|WARNING|ERROR|CRITICAL|INFO)\s*\|/);
    return m ? m[1] : 'INFO';
  }

  function isBuyLine(line)  { return line.includes('매수') || line.includes('BUY'); }
  function isSellLine(line) { return line.includes('매도') || line.includes('SELL'); }

  function formatLine(raw) {
    const level  = getLevel(raw);
    const filter = levelFilter.value;
    if (filter !== 'ALL' && level !== filter) return null;

    const badge = `<span class="level-badge badge-${level}">${level}</span>`;
    let cls = `log-line log-${level}`;
    if (level === 'INFO' && isBuyLine(raw))  cls += ' buy';
    if (level === 'INFO' && isSellLine(raw)) cls += ' sell';

    // 타임스탬프: 날짜/시간 분리 (모바일에서 날짜 CSS로 숨김)
    const formatted = raw
      .replace(
        /(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2})(\.\d+)?/,
        '<span class="ts-date">$1 </span><span class="ts-time">$2</span>'
      )
      .replace(/\| \w+\s*\|/, '| |');

    return `<div class="${cls}">${badge}${formatted}</div>`;
  }

  function renderBuffer() {
    logLines.innerHTML = '';
    lineCount = 0;
    const frag = document.createDocumentFragment();
    for (const raw of logBuffer) {
      const html = formatLine(raw);
      if (!html) continue;
      const div = document.createElement('div');
      div.innerHTML = html;
      frag.appendChild(div.firstChild);
      lineCount++;
    }
    logLines.appendChild(frag);
    if (autoScroll.checked) container.scrollTop = container.scrollHeight;
  }

  function addLine(raw) {
    if (!raw.trim()) return;
    logBuffer.push(raw);
    if (logBuffer.length > MAX_LINES) logBuffer.shift();

    const html = formatLine(raw);
    if (html) {
      logLines.insertAdjacentHTML('beforeend', html);
      lineCount++;
      if (lineCount > MAX_LINES) {
        logLines.firstChild?.remove();
        lineCount--;
      }
      if (autoScroll.checked) container.scrollTop = container.scrollHeight;
    }
  }

  function clearLogs() {
    logBuffer.length = 0;
    logLines.innerHTML = '';
    lineCount = 0;
  }

  // 소스 전환
  let currentSource = 'bot';
  const SRC_LABEL = { bot: '봇', web: '웹', screener: '스크리너' };
  function setSource(src) {
    if (currentSource === src) return;
    currentSource = src;
    ['bot', 'web', 'screener'].forEach(s => {
      document.getElementById(`src-${s}`).className =
        s === src ? 'px-3 py-1 bg-indigo-600 text-white'
                  : 'px-3 py-1 bg-slate-700 text-slate-300';
    });
    clearLogs();
    if (es) es.close();
    connect();
  }

  // EventSource 연결
  let es;
  function connect() {
    es = new EventSource(`/api/logs/stream?source=${currentSource}`);
    es.onopen = () => {
      statusDot.className = 'status-dot connected';
      statusText.textContent = `연결됨 (${SRC_LABEL[currentSource] || currentSource})`;
    };
    es.onmessage = (e) => addLine(e.data);
    es.onerror = () => {
      statusDot.className = 'status-dot disconnected';
      statusText.textContent = '재연결 중...';
      es.close();
      setTimeout(connect, 3000);
    };
  }

  levelFilter.addEventListener('change', renderBuffer);
  connect();
</script>
</body>
</html>
