name: screener-probe

# ① GitHub Actions 전환 1단계 — "CI 데이터센터 IP에서 네이버/야후/pykrx 스크래핑이
#    되는지" 검증용. 수동 실행(workflow_dispatch)만. 되면 본 워크플로우로 확장,
#    안 되면(네이버 IP차단) 파이 청크 재활용(②)으로 선회.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 크리스프 판정 — 3개 데이터소스에 각각 1발씩 쏴서 HTTP 상태/응답크기 출력.
      # 여기서 NAVER가 403/타임아웃이면 IP차단 = ①은 불가(→②로).
      - name: Connectivity probe (Naver / Yahoo / pykrx)
        run: |
          python - <<'PY'
          import datetime as dt
          # 1) 네이버 (핵심 관건 — 데이터센터 IP 차단 악명)
          try:
              import requests
              r = requests.get(
                  "https://finance.naver.com/item/coinfo.naver?code=005930",
                  headers={"User-Agent": "Mozilla/5.0",
                           "Referer": "https://finance.naver.com/sise/"},
                  timeout=15,
              )
              print(f"NAVER : HTTP {r.status_code}  bytes={len(r.content)}")
          except Exception as e:
              print(f"NAVER : FAIL  {e!r}")
          # 2) 야후 (yfinance)
          try:
              import yfinance as yf
              df = yf.download("005930.KS", period="5d", interval="1d",
                               progress=False, auto_adjust=True)
              print(f"YAHOO : rows={len(df)}")
          except Exception as e:
              print(f"YAHOO : FAIL  {e!r}")
          # 3) pykrx (시총 상위 목록 — 유니버스 소스)
          try:
              from pykrx import stock
              for back in range(1, 8):
                  d = (dt.date.today() - dt.timedelta(days=back)).strftime("%Y%m%d")
                  cap = stock.get_market_cap_by_ticker(d, market="KOSPI")
                  if len(cap):
                      print(f"PYKRX : rows={len(cap)}  date={d}")
                      break
              else:
                  print("PYKRX : empty (최근 7일)")
          except Exception as e:
              print(f"PYKRX : FAIL  {e!r}")
          PY

      # end-to-end — 코스피/코스닥 각 30(=60종목) 실제 스코어링. 네이버 industry +
      # DART 재무 + 야후 기술 전 경로 통과. --dry-run 이라 SYMBOLS 미변경.
      - name: Screener end-to-end (small universe)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONUNBUFFERED: '1'
          MALLOC_ARENA_MAX: '2'
        run: |
          python screener.py --mode weekly --market all \
            --market-top 30 --top 2 --dry-run --workers 2
