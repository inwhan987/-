apply plugin: 'com.android.application'

android {
    namespace "com.jetkvm.remote"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.jetkvm.remote"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Explicit, not the implicit default-location debug keystore: confirmed
    // by comparing a downloaded release APK's actual signing certificate
    // against ci/debug.keystore's -- they didn't match, meaning CI's
    // "copy it to ~/.android/debug.keystore" step wasn't actually the file
    // Gradle ended up signing with (some CI runner images set
    // ANDROID_SDK_HOME/ANDROID_USER_HOME to something other than plain
    // ~/.android, silently changing where AGP looks). Pointing straight at
    // our own committed file removes that guesswork entirely -- the exact
    // same file gets used on every build regardless of environment.
    signingConfigs {
        debug {
            storeFile file('../../ci/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Tiny embedded HTTP server backing the local same-origin proxy (see
    // JetKvmProxyServer.java) that makes the device's own /settings page
    // embeddable in-app, the same trick the desktop Electron build uses.
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // NanoWSD (WebSocket-capable NanoHTTPD) for proxying the settings page's
    // own /webrtc/signaling/client socket -- the plain HttpURLConnection
    // proxy below can't do the Upgrade: websocket handshake at all.
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
    // Outbound WebSocket client used to open the real connection to the
    // device on the other side of that same proxy.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Force all plugins to use Java 17 compatibility
subprojects { subproject ->
    if (subproject.name.startsWith('capacitor-')) {
        subproject.android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
