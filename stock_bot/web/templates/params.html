<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>파라미터 — 주식투자프로그램</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --accent: #4f46e5; }
  html { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif; }
  /* 변경된 필드 — 부드러운 앰버 링 */
  input.changed, select.changed {
    outline: none !important;
    box-shadow: 0 0 0 2px #fcd34d !important;
    background: #fffdf5 !important;
    border-color: #fcd34d !important;
  }
  #bt-output { font-family: 'Consolas', 'D2Coding', monospace; white-space: pre; overflow-x: auto; }
  /* 모바일 탭 스크롤 */
  nav { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  /* 터치 타겟 최소 44px, 폰트 16px (모바일 확대 방지) */
  input[data-key], select[data-key] { min-height: 40px; font-size: 15px !important; }
  button { min-height: 36px; }
  /* 필드 전환 */
  input[data-key], select[data-key] { transition: box-shadow .12s ease, border-color .12s ease, background .12s ease; }
  /* 카드 등장 */
  #param-grid > div > div { animation: cardin .18s ease both; }
  @keyframes cardin { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
  /* 은은한 스크롤바 */
  *::-webkit-scrollbar { height: 8px; width: 8px; }
  *::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 9999px; }
  *::-webkit-scrollbar-track { background: transparent; }
  /* 파라미터 카드 헤더의 작은 라벨 */
  .card-eyebrow { font-size: 10px; letter-spacing: 0.14em; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
</style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">
<div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 space-y-6">

  <!-- 헤더 / 네비 -->
  <header class="border-b border-slate-200 pb-4 space-y-4">
    <div class="flex items-center justify-between gap-4 flex-wrap">
      <h1 class="text-[18px] font-bold text-slate-900 tracking-tight">
        주식투자프로그램 <span class="text-slate-400 font-medium">/ 파라미터</span>
      </h1>
      <div class="flex items-center gap-2">
        <span id="save-msg" class="text-sm text-emerald-600 font-semibold hidden">저장됨</span>
        <span id="save-err" class="text-sm text-red-500 font-semibold hidden"></span>
        <button id="btn-reset"
          class="px-3.5 py-2 text-sm font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-md transition">
          초기화
        </button>
        <button id="btn-save"
          class="px-5 py-2 bg-slate-900 text-white text-sm font-semibold rounded-md hover:bg-slate-700 active:scale-[.98] transition">
          저장
        </button>
      </div>
    </div>
    <nav class="flex items-center gap-5 text-[15px] overflow-x-auto -mb-4">
      <a href="/"        class="pb-3 text-slate-600 hover:text-slate-900 border-b-2 border-transparent whitespace-nowrap transition">대시보드</a>
      <a href="/reasons" class="pb-3 text-slate-600 hover:text-slate-900 border-b-2 border-transparent whitespace-nowrap transition">거래 이유</a>
      <a href="/charts"  class="pb-3 text-slate-600 hover:text-slate-900 border-b-2 border-transparent whitespace-nowrap transition">차트</a>
      <a href="/logs"    class="pb-3 text-slate-600 hover:text-slate-900 border-b-2 border-transparent whitespace-nowrap transition">실시간 로그</a>
      <a href="/params"  class="pb-3 text-slate-900 font-bold border-b-2 border-slate-900 whitespace-nowrap">파라미터</a>
    </nav>
  </header>
  <!-- 스크리너 자동 실행 상태 (저장 시 표시) -->
  <div id="sc-auto-status" class="hidden flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-md px-3 py-2">
    <span id="sc-auto-icon" class="text-sm">🔍</span>
    <div class="flex-1 min-w-0">
      <div id="sc-auto-text" class="text-xs font-semibold text-slate-800"></div>
      <div id="sc-auto-sub"  class="text-[11px] text-slate-500 mt-0.5 truncate"></div>
    </div>
    <button id="sc-cancel-btn" onclick="_scCancel()"
            class="hidden shrink-0 px-2.5 py-1 rounded text-xs font-semibold text-red-600 hover:bg-red-50">
      취소
    </button>
  </div>

  <!-- 봇 선택 (상위) -->
  <div id="bot-tabs" class="flex items-center gap-2 flex-wrap"></div>
  <!-- 파라미터 서브탭 -->
  <div id="param-tabs" class="flex items-center gap-1.5 flex-wrap"></div>
  <!-- 파라미터 그리드 (카테고리별) -->
  <div id="param-grid"></div>

  <!-- 임시 휴장일 -->
  <section class="bg-white border border-slate-200 rounded-lg p-5 space-y-3">
    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
      <h2 class="text-[15px] font-bold text-slate-900 tracking-tight">임시 휴장일</h2>
      <span id="hol-msg" class="text-xs font-medium hidden"></span>
    </div>
    <p class="text-sm text-slate-600">
      선거일 등 exchange_calendars 가 모르는 임시공휴일을 등록. 저장 즉시 반영(재시작 불필요).
    </p>
    <div class="flex flex-wrap gap-2">
      <input id="hol-input" type="date"
        class="border border-slate-200 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-400 transition">
      <button id="btn-hol-add"
        class="px-3 py-1.5 bg-slate-900 text-white text-xs font-semibold rounded-md hover:bg-slate-700 active:scale-[.98] transition whitespace-nowrap">
        추가
      </button>
    </div>
    <div>
      <div class="text-[11px] text-slate-400 mb-1.5 uppercase tracking-wider font-semibold">수동 등록</div>
      <div id="hol-user-list" class="flex flex-wrap gap-2"></div>
    </div>
  </section>

  <!-- 백테스트 -->
  <section class="bg-white border border-slate-200 rounded-lg p-5 space-y-3">
    <div class="border-b border-slate-100 pb-2">
      <h2 class="text-[15px] font-bold text-slate-900 tracking-tight">백테스트</h2>
    </div>
    <div class="flex flex-col sm:flex-row flex-wrap gap-2">
      <input id="bt-symbol" value="005930.KS"
        class="border border-slate-200 rounded-md px-3 py-1.5 text-sm flex-1 min-w-0 focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-400 transition"
        placeholder="종목명 또는 코드 (쉼표로 여러개: 삼성전자,하이닉스)">
      <select id="bt-period"
        class="border border-slate-200 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-400 transition bg-white">
        <option value="30d">30일</option>
        <option value="60d" selected>60일</option>
        <option value="90d">90일</option>
      </select>
      <button id="btn-bt"
        class="px-4 py-1.5 bg-slate-900 text-white text-xs font-semibold rounded-md hover:bg-slate-700 active:scale-[.98] transition whitespace-nowrap">
        실행
      </button>
    </div>
    <div id="bt-status" class="hidden items-center gap-3 bg-slate-50 border border-slate-200 rounded-md px-3 py-2">
      <span id="bt-status-icon" class="text-sm">⏳</span>
      <div class="flex-1">
        <div id="bt-status-text" class="text-xs font-semibold text-slate-700"></div>
        <div id="bt-status-sub" class="text-[11px] text-slate-500 mt-0.5"></div>
      </div>
    </div>
    <div id="bt-output-wrap" class="hidden">
      <div class="flex justify-end gap-2 mb-1">
        <button id="btn-bt-copy"  type="button" class="text-xs px-2.5 py-1 text-slate-500 hover:text-slate-900 rounded transition">복사</button>
        <button id="btn-bt-close" type="button" class="text-xs px-2.5 py-1 text-slate-500 hover:text-slate-900 rounded transition">닫기</button>
      </div>
      <pre id="bt-output"
        class="bg-slate-900 text-emerald-300 rounded-md p-4 text-xs overflow-x-auto select-text"
        style="font-family: 'Consolas', 'D2Coding', monospace;"></pre>
    </div>
  </section>

  <!-- 백테스트 히스토리 -->
  <section class="bg-white border border-slate-200 rounded-lg p-5 space-y-3">
    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
      <h2 class="text-[15px] font-bold text-slate-900 tracking-tight">
        백테스트 히스토리 <span class="font-normal text-slate-400">· 최근 20건</span>
      </h2>
      <div class="flex gap-1">
        <button id="btn-bt-history-toggle"  class="text-xs px-2 py-1 text-slate-500 hover:text-slate-900 rounded transition">접기</button>
        <button id="btn-bt-history-refresh" class="text-xs px-2 py-1 text-slate-500 hover:text-slate-900 rounded transition">갱신</button>
      </div>
    </div>
    <div id="bt-history" class="space-y-2"></div>
  </section>

</div>

<script>
// 색상 팔레트 통합 — 카테고리별로 미묘한 eyebrow 톤만 다르게, 나머지는 slate 뉴트럴
const _NEUTRAL = { title: 'text-slate-900', ring: 'focus:ring-slate-900/10' };
const _EYEBROW = {
  violet: 'text-violet-600', indigo: 'text-indigo-600', emerald: 'text-emerald-600',
  rose: 'text-rose-600', sky: 'text-sky-600', amber: 'text-amber-600',
  slate: 'text-slate-500', red: 'text-red-600',
};
const _C = new Proxy({}, {
  get: (_t, k) => ({ ..._NEUTRAL, eyebrow: _EYEBROW[k] || 'text-slate-500' }),
});

const GROUPS = [
  // ── 스크리너: 선별 ─────────────────────────────────────────────────────────
  { title: "스크리너 선별", icon: "🔍", color: "violet", params: [
    { key: "SCREENER_SECTOR", label: "산업 필터", type: "sector-chips", wide: true,
      hint: "저장하면 스크리너가 즉시 실행돼 SYMBOLS(운용 종목 목록)를 자동 갱신합니다. 선택한 섹터 안에서 '고급' 탭의 분석 유니버스(코스피·코스닥 시총 상위 N) 기준으로 가장 강한 종목을 선별. '자동화'의 자동 섹터분석이 ON이면 매일 07:30에 이 항목이 자동 업데이트되므로 수동 저장은 내일 자동 반영 전까지만 유효합니다." },
    { key: "SCREENER_TOP_N",  label: "선별 종목 수", step: "1",
      hint: "스크리너 결과로 SYMBOLS에 등록할 최대 종목 수. 예: 6이면 가장 높은 점수 6종목만 운용. 많을수록 분산되지만 약한 종목까지 포함될 수 있음. (기본 6)" },
  ]},
  // ── 스크리너: 장전 자동화 ──────────────────────────────────────────────────
  { title: "스크리너 자동화", icon: "🤖", color: "violet", params: [
    { key: "SCREENER_AUTO_SECTOR", label: "자동 섹터분석", boolean: true,
      hint: "ON=매일 오전 7:30, 장 시작 전에 코스피+코스닥 전체를 분석해 가장 강한 섹터 1개를 자동 선정하고 SYMBOLS를 갱신합니다. OFF=위의 '산업 필터'에서 수동으로 고정한 섹터를 계속 씁니다. 아래 항목들은 이 스위치가 ON일 때만 동작합니다." },
    { key: "SCREENER_DOWNTREND_HALVE", label: "하락장 종목 수 절반", boolean: true, indent: true,
      hint: "코스피 지수가 이동평균선 아래인 하락장 판정 시 선별 종목 수를 절반으로 자동 축소. 예: TOP_N=6이면 하락장엔 3종목만 운용해 리스크 줄임. '자동 섹터분석' ON 필요." },
    { key: "SCREENER_LLM_REVIEW_ENABLED", label: "Claude 검수", boolean: true, indent: true,
      hint: "ON이면 알고리즘 1차 선별 후 Claude AI가 2차 검수. 섹터 적합성·종목별 이슈를 판단해 부적합하면 차순위로 교체. AI 판단 실패 시 알고리즘 결과 그대로 사용(fail-safe). 하루 2회 호출. 사용 모델은 '거래·AI > LLM 모델 > 장전 검수 모델'에서 선택." },
    { key: "SCREENER_REVIEW_WEBSEARCH", label: "└ 검수 웹 참고", boolean: true, indent: true,
      hint: "ON이면 AI 검수 시 밤사이 글로벌 시장(SOX지수·미국장·환율) 변동과 공시·뉴스를 실시간 웹서치해서 참고합니다. 의심스러운 섹터를 밤사이 악재로 제외하는 등 활용. 선별 범위는 넓히지 않고 검수만 함. 'Claude 검수' ON 필요." },
  ]},
  // ── 스크리너: 고급 ─────────────────────────────────────────────────────────
  { title: "스크리너 고급", icon: "⚙️", color: "violet", params: [
    { key: "SCREENER_RS_DAYS", label: "섹터 강도 기간(거래일)", step: "1",
      hint: "섹터 상대강도(RS)를 계산할 기간. 20이면 최근 20거래일(약 1달) 수익률 기준으로 섹터 순위를 매깁니다. 길게 하면 장기 추세 섹터 선호, 짧게 하면 단기 급등 섹터 선호. (기본 20거래일)" },
    { key: "SCREENER_MIN_STOCKS", label: "섹터 최소 종목 수", step: "1",
      hint: "섹터 후보 자격 조건 — 해당 섹터에 분석 대상 종목이 N개 이상 있어야 섹터 후보로 인정. 너무 적은 종목의 섹터는 한두 종목에 쏠려 강도가 왜곡됨. (기본 5)" },
    { key: "SCREENER_MARKET_TOP", label: "분석 유니버스 (각 시장 시총 상위 N)", step: "100",
      hint: "스크리너가 분석할 종목 풀. '코스피 상위 N' + '코스닥 상위 N'으로, 두 시장 각각 시가총액 기준 상위 N종목(합산이 아닌 각각). 기본 1000 → 코스피 1000+코스닥 1000이지만, 코스피 보통주가 ~800개뿐이라 실제로는 코스피 전량+코스닥 상위 1000. 0=시장 전체. 넓힐수록 소형주까지 포함되나 실행 시간·네이버 요청량이 증가합니다." },
    { key: "SCREENER_NAVER_RPM", label: "네이버 요청 분당 상한", step: "10",
      hint: "네이버 재무·업종 데이터 스크래핑 시 분당 최대 요청 횟수. 너무 높으면 네이버가 일시 차단(403/429 오류 로그). 기본 80이 차단 안정권. 차단 로그가 보이면 60으로 낮추세요. 낮출수록 스크리너 실행 시간이 길어집니다." },
    { key: "SCREENER_REMOTE_ENABLED", label: "원격(CI) 스코어링 오프로드", boolean: true,
      hint: "ON=무거운 점수 계산을 GitHub Actions(클라우드)로 넘겨서 라즈베리파이 메모리 부족(OOM) 방지. 섹터 선정·AI 검수·SYMBOLS 갱신은 파이가 그대로 담당하고 점수 계산만 오프로드. .env에 SCREENER_GH_TOKEN(gist 권한 PAT) 필요. 없으면 자동으로 로컬 계산으로 대체. 재시작 없이 즉시 반영." },
    { key: "SCREENER_MIN_LISTING_DAYS", label: "신규상장 배제(거래일)", step: "10",
      hint: "최근 상장된 신규주를 선별에서 배제. 일봉 이력이 N거래일 미만인 종목 제외. 0=비활성. 신규 상장주는 백테스트 검증이 어렵고 짧은 이력으로 RS·추세 계산이 부정확. 급등하는 신규주 자체는 배제하지 않음. 권장: 60거래일(약 3개월)." },
    { key: "SCREENER_MIN_TURNOVER_EOK", label: "거래대금 하한(억)", step: "10",
      hint: "최근 20일 평균 일거래대금이 N억 미만인 종목 제외. 수익성이 아닌 '실전 체결 안정성' 기준 — 거래대금이 너무 얇으면 대량 매수·매도 시 슬리피지(미끄러짐)가 커짐. 0=비활성. 권장 30억." },
    { key: "SCREENER_MIN_CAP_EOK", label: "시총 하한(억)", step: "100",
      hint: "KRX 시가총액이 N억 미만인 초소형주 제외. 거래대금 하한과 함께 쓰는 보조 안전망. 분석 유니버스(시총 상위 N)가 0=전체이면 시총 정보가 없어 이 컷도 무동작. 0=비활성. 권장 300억." },
  ]},
  // ── 거래 실행 모드 ─────────────────────────────────────────────────────────
  { title: "거래 실행 모드", icon: "⚙️", color: "amber", params: [
    { key: "TRADE_DRY_RUN", label: "검증모드 (주문전송 X)", boolean: true,
      hint: "true=주문을 실제로 전송하지 않고 로그·알림만 기록(검증/테스트 모드). false=실제 주문 전송. 스크리너도 dry run 시 SYMBOLS를 실제 갱신하지 않음. 처음 배포 시 true로 확인 후 false로 전환 권장." },
    { key: "SYMBOLS", label: "운용 종목", type: "symbols-editor", wide: true,

let original = {};

async function loadParams() {
  const res = await fetch('/api/params');
  original = await res.json();
  renderGroups();
}

// 팁은 그대로 표기 — 예전엔 숫자에 "따옴표+색"을 씌웠으나 09:30 같은 시간까지
// 잘려 오히려 지저분해져서 제거. HTML escape 만 수행.
function _formatHint(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 카드 내부에 유니크 tab id 부여용
let _tabCardSeq = 0;

// 파라미터 리스트를 HTML로 렌더 — buildCard / tab panel 공용
function _buildParamsHtml(params, c) {
    let html = '';
    params.forEach(p => {
      // 소제목 구분선 — 필드 없이 구역만 나눔
      if (p.subheader) {
        html += `
          <div class="flex items-center gap-2.5 mt-6 mb-3 first:mt-1">
            <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-[0.14em] shrink-0">${p.subheader}</span>
            <div class="flex-1 h-px bg-slate-100"></div>
          </div>`;
        return;
      }
      const val = original[p.key] ?? '';
      const wide = p.wide;
      // 팁 = 라벨 밑 작은 회색 글씨(항상 표시). 숫자·금액은 자동으로 "따옴표+진한색"으로 강조.
      const hintHtml = p.hint ? `<div class="text-[13px] text-slate-500 leading-relaxed mt-1.5 break-keep">${_formatHint(p.hint)}</div>` : '';
      // 좁은 필드 기본: 숫자·문자 입력은 고정폭, select는 내용 길이에 맞춰 auto.
      const narrowInputCls  = 'w-32 shrink-0 max-w-full';
      const narrowSelectCls = 'w-auto min-w-[6rem] max-w-[14rem] shrink-0';
      const wideCls         = 'w-full max-w-xl';
      const baseCls = `border border-slate-300 rounded-md px-3 py-2 text-[15px] font-medium ${wide ? 'text-left' : 'text-right'} text-slate-900 focus:outline-none focus:ring-2 ${c.ring} focus:border-slate-400 transition bg-white`;
      let fieldHtml;
      if (p.boolean) {
        const t = val.toLowerCase();
        const cls = `${wide ? wideCls : narrowSelectCls} ${baseCls}`;
        fieldHtml = `<select id="${p.key}" data-key="${p.key}" class="${cls}">
          <option value="true"  ${t === 'true'  ? 'selected' : ''}>true</option>
          <option value="false" ${t !== 'true'  ? 'selected' : ''}>false</option>
        </select>`;
      } else if (p.options) {
        const cur = String(val);
        const cls = `${wide ? wideCls : narrowSelectCls} ${baseCls}`;
        fieldHtml = `<select id="${p.key}" data-key="${p.key}" class="${cls}">
          ${p.options.map(o => `<option value="${o}" ${cur === String(o) ? 'selected' : ''}>${o}${p.unit || ''}</option>`).join('')}
        </select>`;
      } else if (p.type === 'sector-chips') {
        fieldHtml = `
          <div class="w-full max-w-2xl">

function buildCard(g) {
    const c = _C[g.color || 'slate'];
    const card = document.createElement('div');
    // rounded-2xl 유지 — _injectScreenerRunBtn/_injectLeaderBtns 셀렉터 앵커
    card.className = `bg-white border border-slate-200 rounded-2xl p-5 hover:border-slate-300 transition-colors duration-150`;
    // 탭 카드 — 여러 subgroup을 한 카드에 담고 상단 탭으로 전환
    if (Array.isArray(g.tabs) && g.tabs.length > 0) {
        // 대형 카드로 확장 (카테고리 전체를 담을 때 넉넉하게)
        card.className = `bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 hover:border-slate-300 transition-colors duration-150 min-h-[420px]`;
        const cardId = `tc-${++_tabCardSeq}`;
        const tabsBtns = g.tabs.map((t, i) => {
            const on = i === 0;
            return `<button type="button" data-tab-btn="${cardId}-${i}"
              class="tc-btn px-3.5 py-2 rounded-lg text-[13px] font-semibold whitespace-nowrap transition ${on ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}">
              ${t.icon || ''} ${t.title}
            </button>`;
        }).join('');
        const panels = g.tabs.map((t, i) => {
            const tabC = _C[t.color || g.color || 'slate'];
            return `<div data-tab-panel="${cardId}-${i}" class="${i === 0 ? '' : 'hidden'} max-w-3xl">
              ${_buildParamsHtml(t.params || [], tabC)}
            </div>`;
        }).join('');
        card.innerHTML = `
          <div class="mb-5 pb-4 border-b border-slate-200">
            <div class="flex items-center gap-1.5 flex-wrap">${tabsBtns}</div>
          </div>
          ${panels}`;
        // 탭 전환 핸들러
        card.querySelectorAll('[data-tab-btn]').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.dataset.tabBtn;
                card.querySelectorAll('[data-tab-btn]').forEach(b => {
                    const on = b.dataset.tabBtn === id;
                    b.className = 'tc-btn px-3 py-1.5 rounded-md text-[13px] font-semibold whitespace-nowrap transition ' +
                        (on ? 'bg-slate-900 text-white' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100');
                });
                card.querySelectorAll('[data-tab-panel]').forEach(pn => {
                    pn.classList.toggle('hidden', pn.dataset.tabPanel !== id);
                });
            });
        });
        return card;
    }
    let html = `
      <div class="mb-4 pb-3 border-b border-slate-200 flex items-center gap-2.5">
        <span class="w-1 h-5 rounded-full ${c.eyebrow.replace('text-', 'bg-')}"></span>
        <h2 class="text-[15px] font-bold ${c.title} tracking-tight">${g.title}</h2>
      </div>`;
    html += _buildParamsHtml(g.params || [], c);
    card.innerHTML = html;
    return card;
}

};
const CATS = BOTS.flatMap(b => b.cats);
let activeBot = BOTS[0].name;
let activeCat = BOTS[0].cats[0];

function _catsOfActiveBot() {
  return (BOTS.find(b => b.name === activeBot) || BOTS[0]).cats;
}

function _catOf(title) {
  for (const cat of CATS) if (CAT_MAP[cat].includes(title)) return cat;
  return CATS[0];
}

function _updateParamTabs() {
  const activeCats = _catsOfActiveBot();
  document.querySelectorAll('.bot-tab').forEach(b => {
    const on = b.dataset.bot === activeBot;
    b.className = 'bot-tab px-4 py-2 rounded-md text-sm font-bold whitespace-nowrap transition-colors duration-100 ' +
      (on ? 'bg-slate-900 text-white' : 'text-slate-700 hover:text-slate-900 hover:bg-slate-100');
  });
  document.querySelectorAll('.param-tab').forEach(b => {
    const inBot = activeCats.includes(b.dataset.cat);
    const on = b.dataset.cat === activeCat;
    b.className = 'param-tab px-3.5 py-1.5 rounded-md text-sm font-semibold whitespace-nowrap transition-colors duration-100 ' +
      (inBot ? '' : 'hidden ') +
      (on ? 'bg-slate-200 text-slate-900' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50');
  });
  document.querySelectorAll('[data-cat-section]').forEach(s => {
    s.classList.toggle('hidden', s.dataset.catSection !== activeCat);
  });
}

// 각 탭에 "저장 안 된 변경 있음" 점 표시 (값 비교 — 저장 로직과 동일 기준)
function _refreshTabBadges() {
  const catDirty = {};
  CATS.forEach(cat => {
    const section = document.querySelector(`[data-cat-section="${cat}"]`);
    const dot = document.querySelector(`.param-tab[data-cat="${cat}"] .tab-dot`);
    let dirty = false;
    if (section) section.querySelectorAll('[data-key]').forEach(el => {
      if (el.value !== (original[el.dataset.key] ?? '')) dirty = true;
    });
    catDirty[cat] = dirty;
    if (dot) dot.classList.toggle('hidden', !dirty);
  });
  BOTS.forEach(bot => {
    const bdot = document.querySelector(`.bot-tab[data-bot="${bot.name}"] .bot-dot`);
    if (bdot) bdot.classList.toggle('hidden', !bot.cats.some(c => catDirty[c]));
  });
}

function renderGroups() {
  const botTabs = document.getElementById('bot-tabs');
  const tabs = document.getElementById('param-tabs');
  const grid = document.getElementById('param-grid');
  botTabs.innerHTML = '';
  tabs.innerHTML = '';
  grid.innerHTML = '';

  const byCat = {};
  CATS.forEach(cat => { byCat[cat] = []; });
  GROUPS.forEach(g => { byCat[_catOf(g.title)].push(g); });

  BOTS.forEach(bot => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.bot = bot.name;
    b.className = 'bot-tab';
    const cnt = bot.cats.reduce((s, c) => s + byCat[c].length, 0);
    b.innerHTML = `${bot.name} <span class="text-xs opacity-60">${cnt}</span><span class="bot-dot ml-0.5 inline-block w-2 h-2 rounded-full bg-amber-500 align-middle hidden" title="저장 안 된 변경 있음"></span>`;
    b.onclick = () => {
      activeBot = bot.name;
      if (!bot.cats.includes(activeCat)) activeCat = bot.cats[0];
      _updateParamTabs();
    };
    botTabs.appendChild(b);
  });

  CATS.forEach(cat => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.cat = cat;
    btn.className = 'param-tab';
    btn.innerHTML = `${cat} <span class="text-xs opacity-60">${byCat[cat].length}</span><span class="tab-dot ml-0.5 inline-block w-2 h-2 rounded-full bg-amber-500 align-middle hidden" title="저장 안 된 변경 있음"></span>`;
    btn.onclick = () => { activeCat = cat; _updateParamTabs(); };
    tabs.appendChild(btn);

    const section = document.createElement('div');
    section.dataset.catSection = cat;
    section.className = 'w-full';
    // 카테고리 내 모든 그룹을 하나의 대형 탭 카드로 합침.
    // 이미 탭 카드인 그룹(g.tabs)은 내부 탭들을 개별 탭으로 평탄화.
    const flatTabs = [];
    byCat[cat].forEach(g => {
      if (Array.isArray(g.tabs) && g.tabs.length > 0) {
        g.tabs.forEach(t => flatTabs.push({
          title: t.title,
          icon: t.icon || '',
          color: t.color || g.color,
          params: t.params || [],
        }));
      } else {
        // "대장주 · 선별·감시" → "선별·감시" 처럼 프리픽스 정리 (있으면)
        const label = g.title.includes(' · ') ? g.title.split(' · ').slice(1).join(' · ') : g.title;
        flatTabs.push({
          title: label,
          icon: '',
          color: g.color,
          params: g.params || [],
        });
      }
    });
    if (flatTabs.length > 0) {
      const mega = buildCard({ title: cat, color: flatTabs[0].color || 'slate', tabs: flatTabs });
      section.appendChild(mega);
    }
    grid.appendChild(section);
  });

  _updateParamTabs();

  document.querySelectorAll('[data-key]').forEach(el => {
    el.addEventListener('change', () => {
      el.classList.toggle('changed', el.value !== (original[el.dataset.key] ?? ''));
      _refreshTabBadges();
    });
    el.addEventListener('input', () => {
      el.classList.toggle('changed', el.value !== (original[el.dataset.key] ?? ''));
      // sector-chips hidden input → chips wrapper에 시각 표시
      const chipsDiv = document.getElementById(`sc-chips-${el.dataset.key}`);
      if (chipsDiv) _renderChips(el, chipsDiv);
      _refreshTabBadges();
    });
  });
  // sector-chips 초기화
  _initAllSectorChips();
  // symbols-editor 초기화
  _initSymbolsEditor();
  // 스크리너 카드에 "지금 실행" 버튼 삽입
  _injectScreenerRunBtn();
  // 대장주 선별·감시 카드에 대장주 선별(업종/테마) 버튼 삽입
  _injectLeaderBtns();
  _refreshTabBadges();
}

function _injectScreenerRunBtn() {
  // SCREENER_SECTOR input이 있는 카드를 찾아 버튼 추가
  const scInput = document.querySelector('[data-key="SCREENER_SECTOR"]');

  const card = scInput.closest('.rounded-2xl');

  btn.className = 'mt-4 w-full py-2 bg-slate-900 text-white text-xs font-semibold rounded-md hover:bg-slate-700 active:scale-[.98] transition';
  btn.innerHTML = '스크리너 지금 실행';

// 대장주 선별·감시 카드에 대장주 선별(업종/테마) 버튼 + 결과영역 삽입
function _injectLeaderBtns() {
  // 선별·감시 카드의 상시 존재 키(LEADER_INTERVAL_MIN)를 앵커로 사용
  const ldInput = document.querySelector('[data-key="LEADER_INTERVAL_MIN"]');

    '<div class="text-[11px] font-medium text-slate-500 mb-2">즉시 선별 · 결과는 디스코드로도 발송</div>' +

  card.appendChild(box);

async function _runLeader(mode) {
  const tBtn = document.getElementById('btn-ld-theme');
  const out  = document.getElementById('ld-result');
  const active = tBtn;
  const orig = active.innerHTML;
  active.disabled = true;
  active.innerHTML = '⏳ 선별 중...';
  out.classList.remove('hidden');
  out.textContent = '🗂️ 테마별 대장주 선별 실행 중… (최대 1~2분, 완료 시 디스코드 알림도 전송)';
  try {
    const res = await fetch('/api/leader/run?mode=' + mode, { method: 'POST' });
    const data = await res.json();
    if (!data.ok || !data.job_id) { out.textContent = '실행 실패: ' + (data.error || '알 수 없는 오류'); return; }
    for (let i = 0; i < 90; i++) {   // 2초 × 90 = 최대 180초 폴링
      await new Promise(r => setTimeout(r, 2000));
      const sres = await fetch('/api/leader/' + data.job_id);
      const sdata = await sres.json();
      if (sdata.status === 'done')      { out.textContent = (sdata.output || '(출력 없음)').replace(/\*\*/g, '').replace(/`/g, ''); return; }
      if (sdata.status === 'error')     { out.textContent = '⚠️ 오류:\n' + (sdata.output || ''); return; }
      if (sdata.status === 'not_found') { out.textContent = 'job을 찾을 수 없습니다.'; return; }
    }
    out.textContent = '시간 초과 — 결과를 가져오지 못했습니다.';
  } catch(e) {
    out.textContent = '요청 실패: ' + e;
  } finally {
    if (tBtn) tBtn.disabled = false;
    active.innerHTML = orig;
  }
}

async function _runScreenerNow() {
  const btn = document.getElementById('btn-sc-run');
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ 실행 중...'; }
  try {
    const res = await fetch('/api/screener/run', { method: 'POST' });
    const data = await res.json();
    if (data.ok && data.job_id) {
      _scAutoStart(data.job_id);
    } else {
      alert('스크리너 실행 실패: ' + (data.error || '알 수 없는 오류'));
    }
  } catch(e) {
    alert('요청 실패: ' + e);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '🔍 스크리너 지금 실행'; }
  }
}

  '엔터테인먼트', // 방송과엔터테인먼트 (HYBE)
  '복합기업',     // 복합기업 (LG 등 지주)
];

function _renderChips(hiddenInput, chipsDiv) {
  const selected = new Set(
    (hiddenInput.value || '').split(',').map(s => s.trim()).filter(Boolean)
  );
  const isChanged = hiddenInput.value !== (original[hiddenInput.dataset.key] ?? '');
  chipsDiv.innerHTML = '';
  _SC_SECTORS.forEach(s => {
    const on = selected.has(s);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `px-3 py-1 rounded-full text-sm font-medium border transition select-none ${
      on ? 'bg-indigo-600 text-white border-indigo-600'
         : 'bg-white text-slate-600 border-slate-300 hover:border-indigo-400'}`;
    btn.textContent = s;
    btn.addEventListener('click', () => {
      if (selected.has(s)) { if (selected.size > 1) selected.delete(s); }
      else selected.add(s);
      hiddenInput.value = [...selected].join(',');
      hiddenInput.dispatchEvent(new Event('input'));
    });
    chipsDiv.appendChild(btn);
  });
  // 변경된 경우 wrapper 테두리 표시
  chipsDiv.parentElement.style.outline = isChanged ? '2px solid #f59e0b' : '';
  chipsDiv.parentElement.style.borderRadius = isChanged ? '8px' : '';
}

function _initAllSectorChips() {
  document.querySelectorAll('[data-key]').forEach(el => {
    if (el.type === 'hidden') {
      const chipsDiv = document.getElementById(`sc-chips-${el.dataset.key}`);
      if (chipsDiv) _renderChips(el, chipsDiv);
    }
  });
}

// ── 운용 종목 에디터 ──────────────────────────────────────────────────────────
let _symNames = {};  // {ticker: '회사명'}

// SYMBOLS 저장 표준형 = 코드 6자리(.KS/.KQ 접미사 제거). KIS 통합코드(J)는 코드만
// 쓰므로 접미사가 불필요하고, 틱로그·스크리너 표기와도 일치시킨다.
function _symNorm(s) { return (s || '').trim().split('.')[0]; }

async function _symFetchNames(symbols) {
  if (!symbols.length) return;
  const missing = symbols.filter(s => !_symNames[s]);
  if (!missing.length) return;
  try {
    const res = await fetch(`/api/symbol-names?symbols=${encodeURIComponent(missing.join(','))}`);
    const data = await res.json();
    data.forEach(({symbol, name}) => { if (name) _symNames[symbol] = name; });
  } catch(e) {}
}

function _symGetHidden() {
  return document.getElementById('SYMBOLS');
}

function _symGetList() {
  const h = _symGetHidden();
  if (!h) return [];
  return (h.value || '').split(',').map(_symNorm).filter(Boolean);
}

function _symSetList(symbols) {
  const h = _symGetHidden();
  if (!h) return;
  const newVal = symbols.join(',');
  h.value = newVal;
  h.classList.toggle('changed', newVal !== (original['SYMBOLS'] ?? ''));
  if (typeof _refreshTabBadges === 'function') _refreshTabBadges();
  _symRenderChips(symbols);
  // bulk textarea 동기화
  const bulk = document.getElementById('sym-bulk-input');
  if (bulk && !bulk.classList.contains('hidden')) bulk.value = newVal;
}

function _symRenderChips(symbols) {
  const chips = document.getElementById('sym-chips');
  if (!chips) return;
  chips.innerHTML = '';
  if (!symbols.length) {
    chips.innerHTML = '<span class="text-xs text-slate-400 italic">종목 없음</span>';
    return;
  }
  symbols.forEach(sym => {
    const name = _symNames[sym] || sym;
    const chip = document.createElement('span');
    chip.className = 'inline-flex items-center gap-1 px-3 py-1 bg-amber-50 border border-amber-200 text-amber-800 rounded-full text-sm font-semibold';
    chip.innerHTML = `<span title="${sym}">${name}</span><button type="button" data-sym="${sym}" class="sym-del ml-1 text-amber-400 hover:text-red-500 font-bold leading-none" style="font-size:15px;min-height:20px">×</button>`;
    chips.appendChild(chip);
  });
  chips.querySelectorAll('.sym-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const list = _symGetList().filter(s => s !== btn.dataset.sym);
      _symSetList(list);
    });
  });
}

async function _initSymbolsEditor() {
  const h = _symGetHidden();
  if (!h) return;
  const symbols = _symGetList();
  // 기존 저장값에 섞인 .KS/.KQ 접미사를 코드로 정규화해 hidden 에 반영한다.
  // original 도 같이 정규화해, 단순 표기 정리가 "변경됨"으로 잘못 뜨지 않게 한다.
  const norm = symbols.join(',');
  h.value = norm;
  original['SYMBOLS'] = (original['SYMBOLS'] || '').split(',').map(_symNorm).filter(Boolean).join(',');
  h.classList.remove('changed');
  await _symFetchNames(symbols);
  _symRenderChips(symbols);

  // 종목명/코드 검색 → 후보 목록에서 선택 추가 (자동추가 안 함)
  const addBtn = document.getElementById('sym-add-btn');
  const addInput = document.getElementById('sym-add-input');
  const resultsBox = document.getElementById('sym-search-results');
  if (addBtn && addInput && resultsBox) {
    let _symSearchTimer = null;
    let _symSearchSeq = 0;

    const hideResults = () => { resultsBox.classList.add('hidden'); resultsBox.innerHTML = ''; };

    const pick = (cand) => {
      const list = _symGetList();
      // SYMBOLS 에는 코드 6자리만 저장한다(.KS/.KQ 접미사 없이). KIS 는 통합코드 J 로
      // 코드만 쓰므로 접미사 불필요하고, 기존 스크리너/틱로그 표기와도 일치한다.
      if (!list.includes(cand.code)) {
        // 칩에 종목명으로 표시되도록 이름을 미리 채운다
        _symNames[cand.code] = cand.name;
        list.push(cand.code);
        _symSetList(list);
      }
      addInput.value = '';
      hideResults();
    };

    const renderResults = (items) => {
      resultsBox.innerHTML = '';
      if (!items.length) {
        resultsBox.innerHTML = '<div class="px-3 py-2 text-sm text-slate-400">검색 결과 없음</div>';
        resultsBox.classList.remove('hidden');
        return;
      }
      items.forEach(cand => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'w-full text-left px-3 py-2 text-sm hover:bg-amber-50 flex items-center justify-between gap-2';
        row.innerHTML = `<span class="font-semibold text-slate-700">${cand.name}</span>`
          + `<span class="text-xs text-slate-400">${cand.market} · ${cand.code}</span>`;
        row.addEventListener('click', () => pick(cand));
        resultsBox.appendChild(row);
      });
      resultsBox.classList.remove('hidden');
    };

    const runSearch = async () => {
      const q = addInput.value.trim();
      if (!q) { hideResults(); return; }
      const seq = ++_symSearchSeq;
      try {
        const res = await fetch(`/api/symbol-search?q=${encodeURIComponent(q)}`);
        const items = await res.json();
        if (seq !== _symSearchSeq) return;  // 늦게 도착한 응답은 버림
        renderResults(Array.isArray(items) ? items : []);
      } catch(e) { hideResults(); }
    };

    addInput.addEventListener('input', () => {
      clearTimeout(_symSearchTimer);
      _symSearchTimer = setTimeout(runSearch, 250);
    });
    addInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); clearTimeout(_symSearchTimer); runSearch(); }
      else if (e.key === 'Escape') { hideResults(); }
    });
    addBtn.addEventListener('click', () => { clearTimeout(_symSearchTimer); runSearch(); });
    document.addEventListener('click', e => {
      if (!resultsBox.contains(e.target) && e.target !== addInput && e.target !== addBtn) hideResults();
    });
  }

  // 직접 입력 토글
  const bulkToggle = document.getElementById('sym-bulk-toggle');
  const bulkInput  = document.getElementById('sym-bulk-input');
  if (bulkToggle && bulkInput) {
    bulkToggle.addEventListener('click', () => {
      const hidden = bulkInput.classList.toggle('hidden');
      bulkToggle.textContent = hidden ? '직접 입력 (쉼표 구분)' : '직접 입력 닫기';
      if (!hidden) bulkInput.value = _symGetList().join(',');
    });
    bulkInput.addEventListener('change', async () => {
      const syms = bulkInput.value.split(',').map(_symNorm).filter(Boolean);
      await _symFetchNames(syms);
      _symSetList(syms);
    });
  }
}

async function _refreshSymbolsEditor(symStr) {
  // 스크리너 완료 후 에디터 갱신
  const h = _symGetHidden();
  if (!h) return;
  const symbols = (symStr || '').split(',').map(_symNorm).filter(Boolean);
  await _symFetchNames(symbols);
  const norm = symbols.join(',');
  h.value = norm;
  original['SYMBOLS'] = norm;
  h.classList.remove('changed');
  _symRenderChips(symbols);
  const bulk = document.getElementById('sym-bulk-input');
  if (bulk && !bulk.classList.contains('hidden')) bulk.value = h.value;
}

document.getElementById('btn-save').addEventListener('click', async () => {
  const updates = {};
  document.querySelectorAll('[data-key]').forEach(inp => {
    if (inp.value !== (original[inp.dataset.key] ?? '')) updates[inp.dataset.key] = inp.value;
  });
  if (!Object.keys(updates).length) { alert('변경된 값이 없습니다.'); return; }
  const res = await fetch('/api/params', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({updates}),
  });
  const data = await res.json();
  if (data.ok) {
    Object.assign(original, updates);
    document.querySelectorAll('[data-key].changed').forEach(i => i.classList.remove('changed'));
    _refreshTabBadges();
    _initAllSectorChips(); // chips 테두리 초기화
    const msg = document.getElementById('save-msg');
    msg.classList.remove('hidden');
    setTimeout(() => msg.classList.add('hidden'), 2500);
    // 대시보드 탭에 즉시 반영
    if ('TRADE_DRY_RUN' in updates) {
      new BroadcastChannel('stockbot').postMessage({dry_run: updates['TRADE_DRY_RUN'] === 'true'});
    }
    // 스크리너 자동 실행 (스크리너 관련 키 변경 시)
    if (data.screener_job_id) {
      _scAutoStart(data.screener_job_id);
    }
  } else {
    const err = document.getElementById('save-err');
    err.textContent = '저장 실패: ' + JSON.stringify(data);
    err.classList.remove('hidden');
    setTimeout(() => err.classList.add('hidden'), 4000);
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  document.querySelectorAll('[data-key]').forEach(inp => {
    inp.value = original[inp.dataset.key] ?? '';
    inp.classList.remove('changed');
  });
  _initAllSectorChips();
  _initSymbolsEditor();
  _refreshTabBadges();
});

// ── 스크리너 자동 실행 상태 ─────────────────────────────────────────────────
let _scAutoPollTimer = null;
let _scActiveJobId = null;   // 취소 버튼이 어느 job 을 죽일지

function _scShowCancel(show) {
  const b = document.getElementById('sc-cancel-btn');
  if (b) b.classList.toggle('hidden', !show);
}

async function _scCancel() {
  if (!_scActiveJobId) return;
  const b = document.getElementById('sc-cancel-btn');
  if (b) { b.disabled = true; b.textContent = '⏹ 취소 중...'; }
  try {
    const res = await fetch(`/api/screener/${_scActiveJobId}/cancel`, { method: 'POST' });
    const data = await res.json();
    // 원격(CI) 취소면 remote:true — CI 런 취소 결과도 함께 표시
    const note = data.remote
      ? (data.ci_cancelled ? ' (CI 런 취소됨)' : ` (CI: ${data.ci_msg || '런 미발견'})`)
      : '';
    _scAutoShowStatus('⏹', '스크리너 취소 요청됨' + note, '', 'bg-slate-100 border border-slate-300');
    document.getElementById('sc-auto-text').className = 'text-sm font-semibold text-slate-700';
  } catch (e) {
    alert('취소 요청 실패: ' + e);
  } finally {
    if (b) { b.disabled = false; b.textContent = '⏹ 취소'; }
    _scShowCancel(false);
  }
}

function _scAutoShowStatus(icon, text, sub, cls) {
  const el = document.getElementById('sc-auto-status');
  el.className = `flex items-center gap-3 rounded-xl px-4 py-3 ${cls}`;
  document.getElementById('sc-auto-icon').textContent = icon;
  document.getElementById('sc-auto-text').textContent = text;
  document.getElementById('sc-auto-sub').textContent  = sub || '';
}

function _scAutoStart(jobId) {
  if (_scAutoPollTimer) { clearInterval(_scAutoPollTimer); _scAutoPollTimer = null; }
  _scActiveJobId = jobId;
  _scShowCancel(true);
  _scAutoShowStatus('🔍', '스크리너 실행 중...', '종목 분석 중입니다 (유니버스 넓히면 40~60분 소요)',
    'bg-violet-50 border border-violet-200');
  document.getElementById('sc-auto-text').className = 'text-sm font-semibold text-violet-800';
  document.getElementById('sc-auto-sub').className  = 'text-xs text-violet-500 mt-0.5 truncate';
  _scAutoPollTimer = setInterval(() => _scAutoPoll(jobId), 5000);
  _scAutoPoll(jobId);
}

async function _scAutoPoll(jobId) {
  try {
    const res  = await fetch(`/api/screener/${jobId}`);
    const data = await res.json();
    if (data.status === 'running') return;
    clearInterval(_scAutoPollTimer); _scAutoPollTimer = null;
    _scShowCancel(false);
    if (data.status === 'done') {
      // "주간 풀 N개: A,B,C" 파싱
      const m = data.output.match(/선별\s*\d+개:\s*((?:[A-Z0-9]+\.K[SQ](?:,\s*)?)+)/);
      const syms = m ? m[1].replace(/\s+/g,'') : null;
      // 결과 없을 때: 마지막 2줄 표시 (필터 결과 등)
      const lastLines = data.output.trim().split('\n').slice(-3).join(' | ').trim().slice(0, 120);
      _scAutoShowStatus(
        syms ? '✅' : '⚠️',
        syms ? 'SYMBOLS 업데이트 완료' : '스크리너 완료 — 매칭 종목 없음',
        syms || lastLines || '(출력 없음)',
        syms
          ? 'flex items-center gap-3 rounded-xl px-4 py-3 bg-emerald-50 border border-emerald-200'
          : 'flex items-center gap-3 rounded-xl px-4 py-3 bg-amber-50 border border-amber-200');
      document.getElementById('sc-auto-text').className = syms
        ? 'text-sm font-semibold text-emerald-800'
        : 'text-sm font-semibold text-amber-800';
      document.getElementById('sc-auto-sub').className = syms
        ? 'text-xs text-emerald-600 mt-0.5 truncate'
        : 'text-xs text-amber-600 mt-0.5 truncate';
      if (syms) { _refreshSymbolsEditor(syms); }
      setTimeout(() => {
        document.getElementById('sc-auto-status').className = 'hidden';
      }, syms ? 60000 : 30000);
    } else {
      _scAutoShowStatus('⚠️', '스크리너 오류', data.output?.slice(0, 80) || '',
        'bg-red-50 border border-red-200');
      document.getElementById('sc-auto-text').className = 'text-sm font-semibold text-red-800';
      document.getElementById('sc-auto-sub').className  = 'text-xs text-red-500 mt-0.5 truncate';
    }
  } catch (e) { /* 네트워크 오류 — 다음 폴링 시 재시도 */ }
}

// ── 백테스트 백그라운드 폴링 ─────────────────────────────────────────────────
const BT_JOB_KEY = 'bt_job';
let _btPollTimer = null;

function _btShowStatus(icon, text, sub, colorClass) {
  const el = document.getElementById('bt-status');
  el.className = `flex items-center gap-3 rounded-xl px-4 py-3 ${colorClass}`;
  document.getElementById('bt-status-icon').textContent = icon;
  document.getElementById('bt-status-text').textContent = text;
  document.getElementById('bt-status-sub').textContent = sub || '';
}

function _btSetRunning(symbol, period) {
  _btShowStatus('⏳', '백테스트 실행 중...', `${symbol} / ${period} — 다른 탭 이동해도 됩니다 (최대 15분)`, 'bg-amber-50 border border-amber-200 text-amber-800');
  document.getElementById('bt-status-text').className = 'text-sm font-semibold text-amber-800';
  document.getElementById('bt-status-sub').className = 'text-xs text-amber-600 mt-0.5';
  document.getElementById('btn-bt').disabled = true;
  document.getElementById('btn-bt').textContent = '⏳ 실행 중...';
}

function _btSetIdle() {
  document.getElementById('bt-status').className = 'hidden';
  document.getElementById('btn-bt').disabled = false;
  document.getElementById('btn-bt').textContent = '▶ 실행';
}

function _btShowResult(output) {
  _btSetDone();
  const out  = document.getElementById('bt-output');
  const wrap = document.getElementById('bt-output-wrap');
  out.textContent = output || '(출력 없음)';
  wrap.classList.remove('hidden');
  wrap.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  // 히스토리 자동 갱신
  if (typeof loadBacktestHistory === 'function') loadBacktestHistory();
}

// 백테스트 결과 닫기 / 복사 버튼
document.getElementById('btn-bt-close').addEventListener('click', () => {
  document.getElementById('bt-output-wrap').classList.add('hidden');
});
document.getElementById('btn-bt-copy').addEventListener('click', async (e) => {
  const out = document.getElementById('bt-output');
  try {
    await navigator.clipboard.writeText(out.textContent);
    const btn = e.currentTarget;
    const orig = btn.textContent;
    btn.textContent = '✓ 복사됨';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  } catch (err) {
    alert('복사 실패: ' + err);
  }
});

function _btSetDone() {
  _btShowStatus('✅', '백테스트 완료!', '결과가 아래에 표시됩니다', 'flex items-center gap-3 rounded-xl px-4 py-3 bg-emerald-50 border border-emerald-200');
  document.getElementById('bt-status-text').className = 'text-sm font-semibold text-emerald-800';
  document.getElementById('bt-status-sub').className = 'text-xs text-emerald-600 mt-0.5';
  document.getElementById('btn-bt').disabled = false;
  document.getElementById('btn-bt').textContent = '▶ 실행';
  setTimeout(_btSetIdle, 4000);
}

async function _btPoll(jobId) {
  try {
    const res = await fetch(`/api/backtest/${jobId}`);
    const data = await res.json();
    if (data.status === 'running') return; // 아직 진행 중, 계속 폴링
    // 완료 or 에러 or not_found
    clearInterval(_btPollTimer);
    _btPollTimer = null;
    localStorage.removeItem(BT_JOB_KEY);
    if (data.status === 'not_found') {
      // 서버 재시작 등으로 job 소멸
      _btShowStatus('⚠️', '결과를 찾을 수 없습니다', '서버가 재시작됐을 수 있어요. 다시 실행해 주세요.', 'bg-red-50 border border-red-200');
      document.getElementById('bt-status-text').className = 'text-sm font-semibold text-red-800';
      document.getElementById('bt-status-sub').className = 'text-xs text-red-500 mt-0.5';
      document.getElementById('btn-bt').disabled = false;
      document.getElementById('btn-bt').textContent = '▶ 실행';
      return;
    }
    _btShowResult(data.output);
  } catch (e) {
    // 네트워크 오류 등 — 잠시 후 재시도
  }
}

function _btStartPolling(jobId, symbol, period) {
  if (_btPollTimer) clearInterval(_btPollTimer);
  _btSetRunning(symbol, period);
  _btPollTimer = setInterval(() => _btPoll(jobId), 3000);
  _btPoll(jobId); // 즉시 한 번
}

// 페이지 로드 시 진행 중인 job 복원 (같은 브라우저: localStorage / 다른 기기: 서버 조회)
(async function restoreJob() {
  // 1) 같은 브라우저: localStorage 우선
  const saved = localStorage.getItem(BT_JOB_KEY);
  if (saved) {
    try {
      const {jobId, symbol, period} = JSON.parse(saved);
      if (jobId) { _btStartPolling(jobId, symbol, period); return; }
    } catch (e) {
      localStorage.removeItem(BT_JOB_KEY);
    }
  }
  // 2) 다른 기기(모바일 등): 서버에서 최근 job 조회
  try {
    const res = await fetch('/api/backtest/latest');
    const data = await res.json();
    if (!data.job_id) return;
    if (data.status === 'running') {
      // 진행 중이면 폴링 재연결
      localStorage.setItem(BT_JOB_KEY, JSON.stringify({jobId: data.job_id, symbol: data.symbol, period: data.period}));
      _btStartPolling(data.job_id, data.symbol, data.period);
    } else if (data.status === 'done' && data.output) {
      // 완료된 결과가 있으면 바로 표시
      _btShowResult(data.output);
    }
  } catch (e) { /* 네트워크 오류 무시 */ }
})();

// ── 백테스트 히스토리 로드/렌더 ─────────────────────────────────────────────
async function loadBacktestHistory() {
  const wrap = document.getElementById('bt-history');
  wrap.innerHTML = '<div class="text-xs text-slate-400">로딩 중...</div>';
  try {
    const res = await fetch('/api/backtest/history?limit=20');
    const items = await res.json();
    if (!items.length) {
      wrap.innerHTML = '<div class="text-xs text-slate-400">아직 백테스트 결과가 없습니다.</div>';
      return;
    }
    wrap.innerHTML = '';
    items.forEach((it, idx) => {
      const dt = new Date(it.finished_at * 1000);
      const dtStr = `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      const scriptLbl = it.script.includes('compare') ? '비교' : '단일';
      const statusBadge = it.status === 'done'
        ? '<span class="text-emerald-600">✓</span>'
        : it.status === 'error'
        ? '<span class="text-red-500">✗</span>'
        : '<span class="text-amber-500">⏳</span>';
      const card = document.createElement('div');
      card.className = 'border border-slate-200 rounded-lg p-3';
      card.innerHTML = `
        <div class="bt-hist-header flex items-center justify-between text-base cursor-pointer hover:bg-slate-50 -m-3 p-3 rounded-lg">
          <div class="flex items-center gap-2">
            ${statusBadge}
            <span class="font-mono text-slate-700 font-semibold">${it.symbol}</span>
            <span class="text-sm text-slate-500">${it.period} · ${scriptLbl}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-sm text-slate-400">${dtStr}</span>
            <span class="bt-hist-arrow text-slate-400 text-sm">▼</span>
          </div>
        </div>
        <div id="bt-hist-body-${idx}" class="hidden mt-3">
          <div class="flex justify-end mb-1">
            <button type="button" class="bt-copy-btn text-sm px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-medium" data-out-id="bt-hist-out-${idx}">📋 복사</button>
          </div>
          <pre id="bt-hist-out-${idx}" class="bg-slate-900 text-emerald-300 rounded p-3 text-sm leading-relaxed overflow-x-auto select-text" style="font-family: 'Consolas', 'D2Coding', 'Courier New', monospace;"></pre>
        </div>
      `;
      // 헤더만 클릭 가능 (펼침/닫힘), 본문 클릭은 영향 없음
      const header = card.querySelector('.bt-hist-header');
      const body   = card.querySelector(`#bt-hist-body-${idx}`);
      const arrow  = card.querySelector('.bt-hist-arrow');
      header.addEventListener('click', async () => {
        if (!body.classList.contains('hidden')) {
          body.classList.add('hidden');
          arrow.textContent = '▼';
          return;
        }
        // 풀 데이터 조회
        const out = document.getElementById(`bt-hist-out-${idx}`);
        try {
          const r = await fetch(`/api/backtest/${it.job_id}`);
          const d = await r.json();
          out.textContent = d.output || it.output_preview || '(출력 없음)';
        } catch (e) {
          out.textContent = it.output_preview || '(불러오기 실패)';
        }
        body.classList.remove('hidden');
        arrow.textContent = '▲';
      });
      // 복사 버튼
      card.querySelector('.bt-copy-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        const outEl = document.getElementById(`bt-hist-out-${idx}`);
        try {
          await navigator.clipboard.writeText(outEl.textContent);
          const btn = e.currentTarget;
          const orig = btn.textContent;
          btn.textContent = '✓ 복사됨';
          setTimeout(() => { btn.textContent = orig; }, 1500);
        } catch (err) {
          alert('복사 실패: ' + err);
        }
      });
      wrap.appendChild(card);
    });
  } catch (e) {
    wrap.innerHTML = `<div class="text-xs text-red-500">히스토리 로딩 실패: ${e}</div>`;
  }
}
document.getElementById('btn-bt-history-refresh').addEventListener('click', loadBacktestHistory);
// 페이지 로드 시 자동 로드
loadBacktestHistory();

document.getElementById('btn-bt').addEventListener('click', async () => {
  const symbol = document.getElementById('bt-symbol').value.trim();
  const period = document.getElementById('bt-period').value;
  document.getElementById('bt-output-wrap').classList.add('hidden');

  // 기존 폴링 중지
  if (_btPollTimer) { clearInterval(_btPollTimer); _btPollTimer = null; }

  _btSetRunning(symbol, period);
  try {
    const res = await fetch('/api/backtest', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({symbol, period}),
    });
    const data = await res.json();
    if (!data.ok) { _btSetIdle(); alert('백테스트 시작 실패: ' + JSON.stringify(data)); return; }
    // job_id 저장 후 폴링 시작
    localStorage.setItem(BT_JOB_KEY, JSON.stringify({jobId: data.job_id, symbol, period}));
    _btStartPolling(data.job_id, symbol, period);
  } catch (e) {
    _btSetIdle();
    alert('오류: ' + e);
  }
});

// ── 백테스트 히스토리 접기/펼치기 ──────────────────────────────────────
(function() {
  const KEY = 'bt_hist_open';
  const toggle = document.getElementById('btn-bt-history-toggle');
  const hist   = document.getElementById('bt-history');
  // 이전 상태 복원 (기본: 펼침)
  const isOpen = localStorage.getItem(KEY) !== 'false';
  if (!isOpen) { hist.classList.add('hidden'); toggle.textContent = '펼치기'; }
  toggle.addEventListener('click', () => {
    const nowHidden = hist.classList.toggle('hidden');
    toggle.textContent = nowHidden ? '펼치기' : '접기';
    localStorage.setItem(KEY, String(!nowHidden));
  });
})();

loadParams();

// ── 임시 휴장일 관리 ────────────────────────────────────────────────────────
let _holUser = [];

function _holMsg(text, ok) {
  const el = document.getElementById('hol-msg');
  el.textContent = text;
  el.className = 'text-sm font-semibold ' + (ok ? 'text-green-600' : 'text-red-500');
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 2500);
}

function _holRender() {
  const userEl = document.getElementById('hol-user-list');
  userEl.innerHTML = _holUser.length
    ? _holUser.map(d => `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-indigo-50 text-indigo-700 text-sm rounded-lg mono">
        ${d}<button data-del="${d}" class="text-indigo-400 hover:text-red-500 font-bold leading-none">×</button></span>`).join('')
    : '<span class="text-sm text-slate-300">없음</span>';
  userEl.querySelectorAll('[data-del]').forEach(b =>
    b.addEventListener('click', () => _holSave(_holUser.filter(d => d !== b.dataset.del))));
}

async function _holLoad() {
  try {
    const d = await (await fetch('/api/holidays')).json();
    _holUser = d.user || [];
    _holRender();
  } catch (e) { _holMsg('불러오기 실패', false); }
}

async function _holSave(dates) {
  try {
    const res = await fetch('/api/holidays', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({dates}),
    });
    const d = await res.json();
    if (d.ok) { _holUser = d.user; _holRender(); _holMsg('✓ 저장됨', true); }
    else { _holMsg('저장 실패: ' + (d.error || ''), false); }
  } catch (e) { _holMsg('저장 실패', false); }
}

document.getElementById('btn-hol-add').addEventListener('click', () => {
  const inp = document.getElementById('hol-input');
  const v = inp.value;
  if (!v) { _holMsg('날짜를 선택하세요', false); return; }
  if (_holUser.includes(v)) { _holMsg('이미 등록됨', false); return; }
  _holSave([..._holUser, v].sort());
  inp.value = '';
});

_holLoad();

// 페이지 로드 시 스크리너 마지막 결과 자동 재연결
(async function() {
  try {
    const res = await fetch('/api/screener/latest');
    const d = await res.json();
    if (!d.job_id) return;
    if (d.status === 'running') {
      _scAutoStart(d.job_id);
    } else if (d.status === 'done') {
      const m = d.output.match(/선별\s*\d+개:\s*((?:[A-Z0-9]+\.K[SQ](?:,\s*)?)+)/);
      const syms = m ? m[1].replace(/\s+/g,'') : null;
      const lastLines = d.output.trim().split('\n').slice(-3).join(' | ').trim().slice(0, 200);
      _scAutoShowStatus(
        syms ? '✅' : '⚠️',
        syms ? 'SYMBOLS 업데이트 완료 (이전 결과)' : '스크리너 완료 — 매칭 종목 없음',
        syms || lastLines || '(출력 없음)',
        syms
          ? 'flex items-center gap-3 rounded-xl px-4 py-3 bg-emerald-50 border border-emerald-200'
          : 'flex items-center gap-3 rounded-xl px-4 py-3 bg-amber-50 border border-amber-200');
      document.getElementById('sc-auto-text').className = syms
        ? 'text-sm font-semibold text-emerald-800'
        : 'text-sm font-semibold text-amber-800';
      document.getElementById('sc-auto-sub').className = syms
        ? 'text-xs text-emerald-600 mt-0.5'
        : 'text-xs text-amber-600 mt-0.5';
    }
  } catch(e) {}
})();
</script>
